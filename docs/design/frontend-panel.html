<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECS Simulator 3.0 · 界面设计面板</title>
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#fafbfe; --surface-3:#f0f2f8;
  --line:#e2e6f0; --line-strong:#cfd6e6;
  --text:#1d2433; --text-2:#4a556c; --muted:#78839a;
  --config:#4457c7; --config-soft:#eef0ff; --config-line:#c9d0f7;
  --runtime:#0f8a6a; --runtime-soft:#e9f7f2; --runtime-line:#bfe6d8;
  --host:#8a5a2b; --host-soft:#fbf2e8; --host-line:#ecd6ba;
  --danger:#c8443b; --danger-soft:#fdeeed; --warn:#b7791f; --warn-soft:#fdf4e4;
  --shadow:0 1px 2px rgba(24,36,64,.04),0 8px 24px rgba(24,36,64,.05);
  --radius:10px; --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--config);outline-offset:2px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--config-soft);border:1px solid var(--config-line);display:grid;place-items:center;color:var(--config);font-weight:700;font-size:14px}
.brand-name{font-weight:700;font-size:13px;letter-spacing:.2px}
.brand-sub{color:var(--muted);font-size:11px}
.nav-group{margin:14px 0 6px;padding:0 8px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--text-2);text-align:left;font-size:12.5px}
.nav-item:hover{background:var(--surface-3)}
.nav-item.active{background:var(--config-soft);color:var(--config);font-weight:600}
.nav-ico{width:16px;text-align:center;font-size:13px;opacity:.85}
.nav-item .count{margin-left:auto;color:var(--muted);font-size:11px;font-family:var(--mono)}
.dev-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text-2);font-size:12.5px;cursor:pointer}
.dev-item:hover{background:var(--surface-3)}
.dev-item.active{background:var(--runtime-soft);color:var(--runtime);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.on{background:#2f9e6f;box-shadow:0 0 0 3px #e2f4ec}
.dot.off{background:#a7b0c2;box-shadow:0 0 0 3px #eef0f5}
.dot.warn{background:#d9a441;box-shadow:0 0 0 3px #fbf1dc}
.dot.err{background:#c8503f;box-shadow:0 0 0 3px #fae7e4}
.main{min-width:0;padding:0 26px 40px}
.topbar{height:52px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.crumb{color:var(--muted);font-size:12px}
.crumb b{color:var(--text);font-weight:600}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;border:1px solid var(--line);background:var(--surface);color:var(--text-2);white-space:nowrap}
.chip.mono{font-family:var(--mono)}
.chip.config{background:var(--config-soft);border-color:var(--config-line);color:var(--config)}
.chip.runtime{background:var(--runtime-soft);border-color:var(--runtime-line);color:var(--runtime)}
.chip.host{background:var(--host-soft);border-color:var(--host-line);color:var(--host)}
.chip.ok{background:var(--runtime-soft);border-color:var(--runtime-line);color:var(--runtime)}
.chip.off{background:var(--surface-3);border-color:var(--line);color:var(--muted)}
.chip.danger{background:var(--danger-soft);border-color:#f2c8c5;color:var(--danger)}
.chip.warn{background:var(--warn-soft);border-color:#f0dcb4;color:var(--warn)}
.page-title{font-size:19px;font-weight:700;margin:0 0 2px}
.page-desc{color:var(--muted);font-size:12px;margin:0 0 16px}
.device-head{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dev-glyph{width:40px;height:40px;border-radius:10px;background:var(--config-soft);border:1px solid var(--config-line);display:grid;place-items:center;color:var(--config);font-size:18px}
.dev-id{min-width:210px}
.dev-id h1{font-size:16px;margin:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dev-id .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
.head-metrics{display:flex;gap:22px;flex-wrap:wrap;margin-left:8px}
.metric .k{color:var(--muted);font-size:10.5px;letter-spacing:.3px}
.metric .v{font-size:13px;font-weight:600;font-family:var(--mono);margin-top:1px}
.head-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:500}
.btn:hover{background:var(--surface-3);border-color:#b9c3d8}
.btn.primary{background:var(--config);border-color:var(--config);color:#fff}
.btn.primary:hover{background:#3a4cb3}
.btn.live{background:var(--runtime);border-color:var(--runtime);color:#fff}
.btn.live:hover{background:#0d755a}
.btn.host{background:var(--host);border-color:var(--host);color:#fff}
.btn.host:hover{background:#774b22}
.btn.danger{color:var(--danger);border-color:#eecac7;background:var(--danger-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11.5px}
.pending{margin-top:12px;border:1px solid #f0dcb4;background:var(--warn-soft);border-radius:9px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.pending .txt{color:#8a5e15}
.pending .spacer{flex:1}
.zonebar{display:flex;gap:8px;margin:18px 0 0;border-bottom:1px solid var(--line);padding-bottom:0}
.zone-btn{display:flex;align-items:center;gap:10px;padding:9px 18px 11px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;position:relative;top:1px}
.zone-btn .zi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px}
.zone-btn.config .zi{background:var(--config-soft);color:var(--config)}
.zone-btn.runtime .zi{background:var(--runtime-soft);color:var(--runtime)}
.zone-btn small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);margin-top:-2px}
.zone-btn.active.config{background:var(--config-soft);border-color:var(--config-line);color:var(--config)}
.zone-btn.active.runtime{background:var(--runtime-soft);border-color:var(--runtime-line);color:var(--runtime)}
.zone-btn.active{border-bottom:2px solid var(--surface)}
.zone-note{padding:9px 0 0;font-size:11.5px;color:var(--muted)}
.zone-note.config{color:var(--config)}
.zone-note.runtime{color:var(--runtime)}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0 14px}
.subtab{padding:5px 11px;border:1px solid transparent;background:transparent;border-radius:7px;color:var(--text-2);font-size:12px}
.subtab:hover{background:var(--surface-3)}
.subtab.active{background:var(--surface);border-color:var(--line-strong);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.card h3{margin:0 0 3px;font-size:13px;font-weight:700}
.card .hint{color:var(--muted);font-size:11px;margin:0 0 12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-head h3{margin:0}
.card-head .spacer{flex:1}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);line-height:1.2}
.kpi .k{color:var(--muted);font-size:11px}
.kpi .d{color:var(--muted);font-size:10.5px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:10.5px;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:11px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2)}
.tag.c{background:var(--config-soft);border-color:var(--config-line);color:var(--config)}
.tag.r{background:var(--runtime-soft);border-color:var(--runtime-line);color:var(--runtime)}
.tag.g{background:var(--runtime-soft);border-color:var(--runtime-line);color:var(--runtime)}
.tag.h{background:var(--host-soft);border-color:var(--host-line);color:var(--host)}
.tag.w{background:var(--warn-soft);border-color:#f0dcb4;color:var(--warn)}
.tag.d{background:var(--danger-soft);border-color:#f2c8c5;color:var(--danger)}
.field{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field label{color:var(--text-2);font-size:12px}
.field .desc{color:var(--muted);font-size:10.5px}
.field input,.field select,.field textarea{width:100%;padding:6px 9px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--text);font:inherit;font-size:12px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--config);background:#fff}
.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--mono);font-size:11.5px;line-height:1.65;white-space:pre;overflow:auto;color:#2c3550;max-height:280px}
.code .k{color:var(--config)} .code .s{color:#a0551f} .code .n{color:#137a68} .code .b{color:#8250b0}
.plan-card{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plan-card.disabled{background:var(--surface-2);color:var(--muted)}
.plan-card .nm{font-weight:700;font-size:12.5px;font-family:var(--mono)}
.plan-card .meta{color:var(--muted);font-size:11px}
.plan-card .spacer{flex:1}
.switch{width:34px;height:19px;border-radius:12px;background:#c9d0e0;border:0;position:relative;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.on{background:var(--runtime)}
.switch.on::after{left:17px}
.timeline{position:relative;padding-left:18px}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--line-strong)}
.tl-row{position:relative;margin-bottom:8px}
.tl-row::before{content:"";position:absolute;left:-16px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--runtime);border:2px solid #fff;box-shadow:0 0 0 1px var(--runtime-line)}
.tl-row.skip::before{background:#a7b0c2;box-shadow:0 0 0 1px var(--line-strong)}
.tl-row.fail::before{background:var(--danger);box-shadow:0 0 0 1px #f2c8c5}
.tl-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:9px 12px;cursor:pointer}
.tl-card:hover{border-color:var(--line-strong);background:var(--surface-2)}
.tl-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px}
.tl-top .spacer{flex:1}
.tl-detail{margin-top:9px;border-top:1px dashed var(--line);padding-top:9px;display:none}
.tl-row.open .tl-detail{display:block}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:11.5px;margin-top:6px}
.kv .k{color:var(--muted)}
.chart-wrap{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:10.5px;margin-top:6px}
.legend-swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.empty{display:grid;place-items:center;text-align:center;padding:34px 16px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:10px;background:var(--surface-2)}
.empty strong{display:block;color:var(--text-2);font-size:13px;margin-bottom:4px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.row .spacer{flex:1}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--runtime);display:inline-block;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,138,106,.35)}70%{box-shadow:0 0 0 7px rgba(15,138,106,0)}100%{box-shadow:0 0 0 0 rgba(15,138,106,0)}}
.banner-config{border-left:3px solid var(--config)}
.banner-runtime{border-left:3px solid var(--runtime)}
.notice{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--line-strong);border-left:3px solid var(--runtime);border-radius:8px;box-shadow:var(--shadow);padding:10px 14px;font-size:12px;min-width:220px;animation:slide .2s ease}
@keyframes slide{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.map-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.map-item .t{font-weight:600;font-size:12px}
.map-item .d{color:var(--muted);font-size:11px;margin-top:3px}
/* 主机列表与主机详情：复用设备详情的全部版式 */
.host-target{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;white-space:nowrap}
.create-form{border:1px dashed var(--host-line);border-radius:9px;background:var(--host-soft);padding:14px 16px;margin-bottom:14px}
.create-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0}
.create-grid label{font-size:11px;color:var(--text-2);display:block;margin-bottom:4px}
.create-grid input{width:100%;padding:6px 9px;border:1px solid var(--line-strong);border-radius:6px;background:#fff;color:var(--text);font:inherit;font-size:12px}
.host-note{color:var(--muted);font-size:11.5px;margin:0}
.preset-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.preset-btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text-2);padding:4px 9px;border-radius:6px;font-size:11.5px}
.preset-btn:hover{background:var(--config-soft);border-color:var(--config-line);color:var(--config)}
select.mini,input.mini{padding:5px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface-2);color:var(--text);font:inherit;font-size:11.5px;width:100%}
.svid-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:8px 0}
.svid-opt{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;background:var(--surface-2);font-size:11.5px}
.filter-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px}
.filter-bar label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.cat{padding:3px 9px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--text-2);font-size:11px}
.cat.off{opacity:.4;text-decoration:line-through}
.msg-row{display:grid;grid-template-columns:82px 84px 76px minmax(0,1fr);gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--line);font-size:11.5px}
.msg-row:hover{background:var(--surface-2)}
.msg-row .body{font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.msg-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sml-box{width:100%;min-height:96px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface-2);color:var(--text);font:12px/1.6 var(--mono);resize:vertical}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.create-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-bar{grid-template-columns:repeat(2,minmax(0,1fr))}.svid-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.g2,.g3,.g4,.map-grid{grid-template-columns:1fr}.main{padding:0 14px 30px}.create-grid,.filter-bar,.svid-grid{grid-template-columns:1fr}.msg-row{grid-template-columns:74px 74px minmax(0,1fr)}.msg-row>:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div><div class="brand-name">SECS Simulator</div><div class="brand-sub">3.0 界面设计</div></div>
    </div>
    <div class="nav-group">设备清单</div>
    <button class="nav-item" data-view="workbench"><span class="nav-ico">▦</span>工作台<span class="count" id="navDevCount">3</span></button>
    <div id="navDevices"></div>
    <div class="nav-group">主机清单</div>
    <button class="nav-item" data-view="hostlist"><span class="nav-ico">⇄</span>主机模拟<span class="count" id="navHostCount">4</span></button>
    <div id="navHosts"></div>
    <div class="nav-group">独立工具</div>
    <button class="nav-item" data-view="hosttemplates"><span class="nav-ico">◈</span>主机模板</button>
    <button class="nav-item" data-view="templates"><span class="nav-ico">◇</span>设备模板</button>
    <button class="nav-item" data-view="audit"><span class="nav-ico">☰</span>审计</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="crumb" id="crumb"><b>工作台</b> / 设备 / ETCH-01</span>
      <span class="spacer"></span>
      <span class="chip ok"><span class="pulse"></span> 实时更新</span>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="notice" id="notice"></div>

<script>
/* 演示数据：交互只改内存状态 */
const state = {
  view: 'device',
  zone: 'config',
  page: { config: 'overview', runtime: 'executions' },
  link: 'CONNECTED',
  controlState: 'ONLINE',
  configVer: 7, runningVer: 6,
  svid: 182.4,
  series: [168,170,171,169,172,175,174,178,180,179,181,182,181,183,182,182.4],
  plans: [
    { id:'加工开始', ceid:2001, trigger:'每 60 秒', enabled:true,
      actions:['事件报告 · CEID 2001'], effects:['1001 脉冲到 250，保持 8 秒','1003 设为 6.5，20 秒回落','1101 增加 20'],
      next:'00:42', fires:12, skipped:0 },
    { id:'超温报警', ceid:2004, trigger:'1001 > 240 持续 5 秒', enabled:false,
      actions:['事件报告 · CEID 2004','报警 · ALID 7'], effects:['1001 恢复曲线','1004 设为 0'],
      next:'条件驱动', fires:0, skipped:0 },
    { id:'加工结束', ceid:2002, trigger:'加工开始后 30 秒', enabled:true,
      actions:['事件报告 · CEID 2002'], effects:['1101 恢复','1004 设为 0'],
      next:'00:12', fires:11, skipped:0 }
  ],
  executions: [

function catOf(sf){
  const s = String(sf).replace(/\s|W/g,'').toUpperCase();
  if (/^S1F(1|2)$/.test(s)) return '探测';
  if (/^S1F(3|4|11|12)$/.test(s)) return '采集';
  if (/^S6F(1|2)$/.test(s)) return 'Trace';
  if (/^S6F(11|12)$/.test(s)) return '事件';
  if (/^S1F(13|14|15|16|17|18)$/.test(s)) return '通信';
  if (/^S5F(1|2)$/.test(s)) return '报警';
  if (/^S10F(3|4)$/.test(s)) return '终端';
  return '其它';
}

function toast(msg, tone){
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = tone === 'danger' ? 'var(--danger)' : tone === 'config' ? 'var(--config)' : tone === 'host' ? 'var(--host)' : 'var(--runtime)';
  el.textContent = msg;
  $('#notice').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* 通用片段 */
function linkUp(p){
  return p==='CONNECTED'||p==='LISTENING'||p==='CONNECTING'||p==='STARTING';
}
function phaseChip(phase){
  if (phase === 'CONNECTED') return '<span class="chip ok">● 已连接</span>';
  if (phase === 'LISTENING') return '<span class="chip warn">◐ 等待连接</span>';
  if (phase === 'CONNECTING' || phase === 'STARTING') return '<span class="chip warn">◌ 连接中</span>';
  if (phase === 'FAILED') return '<span class="chip danger">● 连接失败</span>';
  return '<span class="chip off">○ 已断开</span>';
}
function linkChip(){
  return phaseChip(state.link);
}
function ctrlChip(){
  const on = state.link === 'CONNECTED';
  return `<span class="chip ${on?'ok':'off'}">${on?state.controlState:'离线'}</span>`;
}

/* 变量 / 报告 / 事件定义的共用编辑卡：配置区与运行区各用一份数据 */
function catalogRows(kind){
  if (kind === 'cfgceid') return state.cfgCeids;
  if (kind === 'cfgrpt') return state.cfgReports;
  if (kind === 'rtceid') return state.rtCeids;
  if (kind === 'svid') return state.cfgSvids;
  return state.rtReports;
}
function catalogKey(kind){
  if (kind.endsWith('ceid')) return 'ceid';
  if (kind === 'svid') return 'svid';
  return 'rptid';
}
function catalogNoun(kind){
  if (kind.endsWith('ceid')) return '事件';
  if (kind === 'svid') return '变量';
  return '报告';
}
function openCatalogEditor(kind, id){
  const key = catalogKey(kind);
  const rows = catalogRows(kind);
  const row = id === null ? null : rows.find(r => r[key] === id);
  const base = kind === 'svid' ? 1001 : kind.endsWith('ceid') ? 2001 : 3001;
  const nextId = rows.length ? Math.max(...rows.map(r => r[key])) + 1 : base;
  state.editRow = { kind, id };
  if (kind === 'svid') {
    state.editForm = { id: row ? row.svid : nextId, name: row ? row.name : '', unit: row ? row.unit : 'CH1',
      type: row ? row.type : 'F4', source: row ? row.source : 'fixed', value: row ? row.value : '' };
  } else if (kind.endsWith('ceid')) {
    state.editForm = { id: row ? row.ceid : nextId, name: row ? row.name : '', unit: row ? row.unit : 'CH1', reports: row ? [...row.reports] : [] };
  } else {
    state.editForm = { id: row ? row.rptid : nextId, unit: row ? row.unit : 'CH1', svids: row ? [...row.svids] : [] };

function saveCatalogEditor(){
  const { kind, id } = state.editRow;
  const key = catalogKey(kind);
  const noun = catalogNoun(kind);
  const rows = catalogRows(kind);
  const f = state.editForm;
  const newId = Number(f.id);
  if (!Number.isInteger(newId) || newId < 0) { toast('编号需为非负整数', 'danger'); return; }
  if (id === null && rows.some(r => r[key] === newId)) { toast(`编号 ${newId} 已存在`, 'danger'); return; }
  if (kind !== 'cfgrpt' && kind !== 'rtrpt' && !String(f.name).trim()) { toast(`请填写${noun}名称`, 'danger'); return; }
  if ((kind === 'cfgrpt' || kind === 'rtrpt') && !f.svids.length) { toast('报告至少要包含一个变量', 'danger'); return; }
  let payload;
  if (kind === 'svid') payload = { svid:newId, name:String(f.name).trim(), unit:f.unit, type:f.type, source:f.source, value:f.source==='fixed'?String(f.value).trim():'' };
  else if (kind.endsWith('ceid')) payload = { ceid:newId, name:String(f.name).trim(), unit:f.unit, reports:[...f.reports] };
  else payload = { rptid:newId, unit:f.unit, svids:[...f.svids] };
  if (id === null) rows.push({...payload, src: kind.startsWith('rt') ? 'new' : 'config'});
  else {
    const k = rows.findIndex(r => r[key] === id);
    if (k >= 0) rows[k] = {...rows[k], ...payload, src: kind.startsWith('rt') ? 'edited' : rows[k].src};
  }
  state.editRow = null;
  toast(kind.startsWith('rt')
    ? `已${id===null?'新增':'修改'}${noun} ${newId}，只对本次运行有效`
    : `已${id===null?'新增':'修改'}${noun} ${newId}，点「保存配置」后重载生效`,
    kind.startsWith('rt') ? undefined : 'config');
  render();
}

/* 运行区 */
function sparkline(){
  const w = 620, h = 118, pad = 12;
  const vals = state.series, min = Math.min(...vals) - 8, max = Math.max(...vals) + 8;
  const pts = vals.map((v,i) => {
    const x = pad + i * (w - pad*2) / (vals.length - 1);
    const y = h - pad - (v - min) / (max - min || 1) * (h - pad*2);
    return [x,y];
  });
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  const marks = [3, 8, 13].map(i => `<line x1="${pts[i][0].toFixed(1)}" y1="${pad}" x2="${pts[i][0].toFixed(1)}" y2="${h-pad}" stroke="#4457c7" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>`).join('');
  const dots = [3,8,13].map(i => `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="3.2" fill="#0f8a6a" stroke="#fff" stroke-width="1.5"/>`).join('');
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="SVID 1001 曲线">
      <rect x="0" y="0" width="${w}" height="${h}" fill="#fafbfe"/>
      ${[0,1,2,3].map(i=>`<line x1="${pad}" y1="${pad+i*(h-pad*2)/3}" x2="${w-pad}" y2="${pad+i*(h-pad*2)/3}" stroke="#e8ecf5" stroke-width="1"/>`).join('')}
      ${marks}
      <path d="${area}" fill="#0f8a6a" opacity=".08"/>
      <path d="${line}" fill="none" stroke="#0f8a6a" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
      <text x="${w-pad}" y="${h-2}" text-anchor="end" font-size="9" fill="#78839a">时间 →</text>
    </svg>
    <div class="chart-legend">
      <span><i class="legend-swatch" style="background:#0f8a6a"></i>SVID 1001 · TEMP_PV (C)</span>
      <span><i class="legend-swatch" style="background:#4457c7"></i>事件触发竖线</span>
      <span>当前值 <b class="mono">${state.svid.toFixed(1)}</b></span>
    </div>
  </div>`;
}

function timeline(){
  const rows = visibleExecutions();

      </div></div></div>`;
  }).join('')}</div>`;

function hostSparkline(){
  const w = 620, h = 118, pad = 12;
  const vals = state.series, min = Math.min(...vals) - 8, max = Math.max(...vals) + 8;
  const pts = vals.map((v,i) => [pad + i * (w - pad*2) / (vals.length - 1),
    h - pad - (v - min) / (max - min || 1) * (h - pad*2)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pad} ${h-pad} Z`;
  return `<div class="chart-wrap">
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="采集变量曲线">
      <rect x="0" y="0" width="${w}" height="${h}" fill="#fafbfe"/>
      ${[0,1,2,3].map(i=>`<line x1="${pad}" y1="${pad+i*(h-pad*2)/3}" x2="${w-pad}" y2="${pad+i*(h-pad*2)/3}" stroke="#e8ecf5" stroke-width="1"/>`).join('')}

function buildS2F23(h){
  if (h.manual) return `S2F23 W\n<L[6]\n  <U4 ${h.trace.trid}>\n  <A "000001">\n  <U4 ${h.trace.totsmp}>\n  <U4 ${h.trace.repgsz}>\n  <L[2] <U4 1001> <U4 1003>>\n>`;
  const list = h.trace.svids.map(id=>`<U4 ${id}>`).join(' ');
  return `S2F23 W\n<L[6]\n  <U4 ${h.trace.trid}>\n  <A "000001">\n  <U4 ${h.trace.totsmp}>\n  <U4 ${h.trace.repgsz}>\n  <L[${h.trace.svids.length}] ${list}>\n>`;
}
function hostMessages(h){
  /* 第三轮修订 13:收发记录只看本主机 */
  return h.messages.map(m => ({...m, host:h.id, cat:catOf(m.sf)}))
    .sort((a,b)=> b.at.localeCompare(a.at));
}
function filteredHostMessages(){
  const f = state.hFilter, h = curHost();
  return hostMessages(h).filter(m => {
    if (f.clearAt && m.at <= f.clearAt) return false;   /* 「清理」水位:只显示清理之后的报文 */
    if (f.dir === 'sent' && m.dir !== '发送') return false;
    if (f.dir === 'received' && m.dir !== '接收') return false;
    if (f.sf && !m.sf.replace(/\s|W/g,'').toLowerCase().startsWith(f.sf.replace(/\s/g,'').toLowerCase())) return false;
    if (f.kw && !m.body.toLowerCase().includes(f.kw.toLowerCase())) return false;
    if (state.hCats[m.cat] === false) return false;
    return true;
  });
}
function msgListHtml(){
  const rows = filteredHostMessages();
  if (!rows.length) return '<div class="empty" style="padding:24px"><div>当前条件下没有报文，放宽条件、点「清理」后再收，或点「清空过滤」。</div></div>';
  return `<div class="msg-list">${rows.map(m => `<div class="msg-row">
      <span class="mono muted">${m.at}</span>
      ${m.dir==='发送'?'<span class="tag c">发 → 设备</span>':'<span class="tag r">收 ← 设备</span>'}
      <span class="mono">${esc(m.sf)}</span>

      <div class="row"><span class="spacer"></span><button class="btn primary" data-h="save">保存设置</button></div>`)}
  </div>`;
  return '';
}

/* 主机详情 · 运行区 */
function hostRuntimeContent(){

  if (p !== 'status' && !on) return hostOffline();

  if (p === 'status') return `<div class="grid g4">
    ${card('连接状态','', `<div class="kpi"><div class="v" style="font-size:16px;color:${on?'var(--runtime)':h.phase==='FAILED'?'var(--danger)':'var(--muted)'}">${phaseLabel(h.phase)}</div><div class="k">链路</div><div class="d">${on?esc(h.target)+':'+h.port:'目标地址已释放，主机仍保留'}</div></div>`)}
    ${card('控制状态','', `<div class="kpi"><div class="v" style="font-size:16px">${on?h.control:'离线'}</div><div class="k">控制状态</div></div>`)}
    ${card('每分钟报文','', `<div class="kpi"><div class="v">${on?42:0}</div><div class="k">本台主机</div></div>`)}
    ${card('采集状态','', `<div class="kpi"><div class="v" style="font-size:16px">${h.collectorOn?'采集中':'未采集'}</div><div class="k">S1F3 周期采集</div></div>`)}
  </div>
  ${h.phase==='FAILED'?`<div class="pending" style="margin-top:12px"><span class="tag d">连接失败</span>
    <span class="txt">${esc(h.lastError||'目标未响应')}。${h.autoReconnect?`已重试 ${h.retryCount} 次，${esc(h.nextRetryAt||'5 秒后')}再试`:'已停下不再重试'}，其它主机不受影响。</span><span class="spacer"></span>
    <button class="btn sm" data-h="${h.autoReconnect?'auto:off':'auto:on'}">${h.autoReconnect?'关闭自动重连':'打开自动重连'}</button>
    <button class="btn sm primary" data-h="connect">重新连接</button></div>`:''}
  <div class="grid g2" style="margin-top:12px">
    ${card('最近连接记录','', table(['时刻','变化','说明'],
      h.phase==='FAILED'
        ? [[h.connectedAt==='—'?'20:06:40':h.connectedAt,'→ 连接失败',esc(h.lastError||'目标未响应')],
           ['20:06:35','→ 连接中','点击「连接」'],['20:04:00','→ 已断开','主机创建完成，未连接']]
        : [['20:06:12','→ 已连接','目标接受连接，状态在线'],['20:05:40','→ 已断开','点击「断开连接」，释放目标地址'],
           ['20:05:41','→ 已连接','点击「重新连接」，恢复收发'],['20:04:00','→ 已断开','主机启动完成']]))}
    ${card('设置状态','', `
      <div class="field"><label>当前生效版本</label><div class="mono">${on?'v'+h.runningVer:'—'}</div></div>
      <div class="field"><label>最新设置版本</label><div class="mono">v${h.settingVer}</div></div>
      <div class="field"><label>状态</label><div>${h.settingVer!==h.runningVer?'<span class="tag w">设置待生效</span>':'<span class="tag g">一致</span>'}</div></div>
      <div class="field"><label>自动重连</label><div>${h.autoReconnect?`<span class="tag g">开</span> <span class="muted small">已重试 ${h.retryCount} 次</span>`:'<span class="tag">关 · 失败即停</span>'}</div></div>
      <p class="small muted" style="margin:8px 0 10px">重新连接会按最新设置恢复，手动开始或停止的采集会重置。</p>
      <div class="row"><button class="btn sm" data-h="select">选用为当前主机</button>
        <button class="btn sm" data-h="collect:${h.collectorOn?'stop':'start'}">${h.collectorOn?'停止采集':'开始采集'}</button></div>`)}
  </div>`;

  if (p === 'messages') {
    const quick = HOST_PRESETS.filter(x=>x.q);
    const groups = [...new Set(HOST_PRESETS.map(x=>x.g))];
    return `<div class="grid g2">
      ${card('发送目标','<span class="chip runtime">本主机</span>', `
        <div class="field"><label>当前主机</label><div class="mono">${esc(h.id)} · ${esc(h.target)}:${h.port}</div></div>
        <p class="small muted" style="margin:6px 0 0">运行区只操作本主机：发送、压测、采集都只作用于这一台；其它主机请在各自详情页操作。</p>`)}
      ${card('发送消息','<span class="chip runtime">当前运行 · 仅本次连接有效</span>', `
        <div class="preset-row">${quick.map(x=>
          `<button class="preset-btn" title="${esc(x.d)}" data-h="preset:${HOST_PRESETS.indexOf(x)}">${esc(x.l)}</button>`).join('')}</div>
        <div class="row" style="margin-bottom:9px"><select class="mini" data-hsel="preset" style="width:auto;min-width:190px">
          <option value="">更多预设…</option>
          ${groups.map(g=>`<optgroup label="${esc(g)}">${HOST_PRESETS.map((x,i)=>x.g===g?`<option value="${i}">${esc(x.l)} · 回 ${esc(x.r)}</option>`:'').join('')}</optgroup>`).join('')}
        </select><span class="small muted">共 ${HOST_PRESETS.length} 条模板</span></div>
        <textarea class="sml-box" data-hsml="1" spellcheck="false">${esc(h.sml)}</textarea>
        <p class="small muted" style="margin:8px 0 10px">带 W 的报文会等待设备回复；模板填入后仍可修改 SVID、CEID 与时间再发送。</p>
        <div class="row"><span class="spacer"></span><button class="btn live" data-h="send">发送</button></div>`)}
      ${card('常用命令','', `<div class="row" style="gap:7px">
          <button class="btn sm" data-h="cmd:s1f1">S1F1 握手</button>
          <button class="btn sm" data-h="cmd:s1f3">S1F3 读变量</button>
          <button class="btn sm" data-h="cmd:s2f15">S2F15 写常量</button>
          <button class="btn sm" data-h="cmd:s2f33">S2F33 定义报告</button></div>
        <p class="small muted" style="margin:10px 0 0">点击直接以当前主机身份发出，收发明细在「收发记录」里。</p>`)}
      ${card('发送结果','<button class="btn sm" data-h="results:clear">清空</button>',
        state.hSendResults.length
          ? table(['结果','耗时 / 原因'], state.hSendResults.map(r=>[
              `<span class="tag g">${esc(r.result)}</span>`,esc(r.detail)]))
          : '<div class="empty" style="padding:22px"><div>还没有发送结果。</div></div>')}
      ${card('压测发送','<span class="chip runtime">服务端循环发送</span>', `
        <div class="grid g2" style="gap:10px">
          <div><label class="small muted">次数</label><input class="mini" data-hburst="count" value="${esc(state.hBurstCount)}"></div>
          <div><label class="small muted">间隔 ms（0 = 全速）</label><input class="mini" data-hburst="interval" value="${esc(state.hBurstInterval)}"></div>
        </div>
        <p class="small muted" style="margin:9px 0">同一条报文连续发送，带 W 的逐条等待回复，最长 5 分钟自动收尾。</p>
        <div class="row"><span class="spacer"></span><button class="btn live" data-h="burst">压测发送</button></div>`)}
      ${card('压测结果','',
        state.hBurst && state.hBurst.length
          ? table(['结果','耗时 / 分位'], state.hBurst.map(r=>[
              `<span class="tag g">${esc(r.result)}</span>`,`<span class="small">${esc(r.detail)}</span>`]))
          : '<div class="empty" style="padding:22px"><div>还没有压测结果。</div></div>')}
    </div>`;
  }

  if (p === 'trace') {
    const btn = h.control === 'ONLINE'
      ? `<button class="btn sm" data-h="offline">发送 S1F15 下线</button>`
      : `<button class="btn sm" data-h="online">发送 S1F17 上线</button>`;
    return `<div class="grid g2">
      ${card('Trace 采集',`<div class="row">${h.manual?'':btn}<span class="chip ${h.control==='ONLINE'?'ok':'warn'}">${h.control}</span></div>`, `
        ${h.control!=='ONLINE'&&!h.manual?'<div class="pending" style="margin:0 0 10px"><span class="txt">设备还没上线：S2F23 会被接受，但 S6F1 暂时不会上报。点右上角「发送 S1F17 上线」。</span></div>':''}
        <div class="field"><label>TRID</label><div class="mono">${h.trace.trid}</div></div>
        <div class="field"><label>采样周期</label><div class="mono">${h.trace.dsper} ms</div></div>
        <div class="field"><label>总样本数 / 每条样本数</label><div class="mono">${h.trace.totsmp} / ${h.trace.repgsz}</div></div>
        <div class="field"><label>采集变量</label><div class="mono">${h.manual?'按报文填写':h.trace.svids.join(', ')}</div></div>
        <div class="row" style="margin-top:12px"><span class="spacer"></span>
          <button class="btn" data-h="trace:gen">生成 S2F23</button>
          <button class="btn live" data-h="trace:send">生成并发送 S2F23</button></div>`)}
      ${card('生成的 S2F23','<button class="btn sm" data-h="trace:clear">收起</button>',
        state.hTraceText?`<div class="code">${esc(state.hTraceText)}</div>`
          :'<div class="empty" style="padding:22px"><div>点「生成 S2F23」查看将要发出的报文。</div></div>')}
      ${card('发送结果','', state.hTraceResult
        ? `<div class="code">${esc(state.hTraceResult)}</div>`
        : '<div class="empty" style="padding:22px"><div>还没有发送结果。</div></div>')}
      ${card('采集说明','', `<p class="small muted" style="margin:0 0 8px">采样周期按整秒生效、最小 1 秒；总样本数填 0 可提前终止。</p>
        <p class="small muted" style="margin:0">上报的 S6F1 会出现在「收发记录」里；配置只属于当前主机。</p>`)}
    </div>`;
  }

  if (p === 'collect') {
    const st = h.collectorOn?'采集中':(h.collector.svids.length?'已配置':'未配置');
    return `<div class="grid g2">
      ${card('采集控制',`<span class="chip ${h.collectorOn?'ok':'off'}">${st} · ${h.samples} 点</span>`, `
        <div class="row" style="gap:7px">
          <button class="btn sm live" data-h="collect:save">下发配置</button>
          <button class="btn sm" data-h="collect:start" ${h.collectorOn?'disabled':''}>手动开始</button>
          <button class="btn sm" data-h="collect:stop" ${h.collectorOn?'':'disabled'}>手动停止</button>
          <span class="spacer"></span>
          <button class="btn sm" data-h="collect:csv">导出 CSV</button>
          <button class="btn sm" data-h="collect:import">导入 CSV</button>
          ${state.hImported?`<button class="btn sm ghost" data-h="collect:exit">退出导入视图</button>`:''}
        </div>
        <p class="small muted" style="margin:10px 0 0">收到「启动 CEID」的事件即自动开始采集；手动启停只对本次连接有效。</p>
        ${state.hImported?`<div class="pending" style="margin-top:10px"><span class="txt">正在查看导入文件 <b>${esc(state.hImported)}</b>，只在本页显示。</span></div>`:''}`)}
      ${card('采集统计','', `<div class="grid g3" style="gap:8px">
        <div class="map-item"><div class="t">${h.samples}</div><div class="d">采样点</div></div>
        <div class="map-item"><div class="t">${h.decodeErrors}</div><div class="d">解码错误</div></div>
        <div class="map-item"><div class="t">${h.lastRttMs===null?'—':h.lastRttMs+' ms'}</div><div class="d">最近往返耗时</div></div>
      </div>
      <p class="small muted" style="margin:10px 0 0">最近值 182.4 · 范围 168.0–250.0 · 最小 / 最大 / 平均 三条带</p>`)}
      ${card(state.hImported?'导入视图 · SVID 1001':'采集曲线 · SVID 1001','', hostSparkline())}
      ${card('手动发送一条 S1F3','<span class="small muted">整报文 · 一次性</span>', `
        <p class="small muted" style="margin:0 0 8px">不进周期采集，只发一次并显示回复：用来确认对端在不在、变量编号对不对。</p>
        <textarea class="sml-box" data-hmanual="1" rows="4">${esc(state.hManualSml)}</textarea>
        <div class="row" style="margin-top:9px"><span class="spacer"></span><button class="btn live" data-h="manual:s1f3">发送 S1F3</button></div>
        ${state.hManualReply?`<div class="code" style="margin-top:9px">${esc(state.hManualReply)}</div>`:''}`)}
    </div>`;
  }

  if (p === 'monitor') {
    const f = state.hFilter, rows = filteredHostMessages(), all = hostMessages(curHost());
    const sent = all.filter(m=>m.dir==='发送').length, recv = all.length - sent;
    const cleared = !!f.clearAt;
    return `<div class="grid" style="gap:12px">
      ${card(`过滤 · ${esc(curHost().id)}`,`<div class="row"><button class="btn sm" data-h="filter:clear">清空过滤</button>
        <button class="btn sm" data-h="monitor:clear" title="清掉当前显示的报文，之后只显示新收发的">清理</button>
        <button class="btn sm" data-h="filter:export">导出过滤结果</button></div>`, `
        <div class="filter-bar">
          <div><label>方向</label><select class="mini" data-hfilter="dir">
            <option value="all" ${f.dir==='all'?'selected':''}>收发都看</option>
            <option value="sent" ${f.dir==='sent'?'selected':''}>只看主机发出</option>
            <option value="received" ${f.dir==='received'?'selected':''}>只看设备发来</option></select></div>
          <div><label>SxFy</label><input class="mini" data-hfilter="sf" value="${esc(f.sf)}" placeholder="如 S6F1"></div>
          <div><label>内容</label><input class="mini" data-hfilter="kw" value="${esc(f.kw)}" placeholder="搜报文体里的编号 / 文本"></div>
        </div>
        <div class="cat-row">${MSG_CATS.map(c=>`<button class="cat ${state.hCats[c]===false?'off':''}" data-h="cat:${c}">${c}</button>`).join('')}
          <span class="spacer"></span>
          <button class="btn sm" data-h="cats:all">全部显示</button>
          <button class="btn sm" data-h="cats:none">全部屏蔽</button>
          <button class="btn sm" data-h="filter:import">导入记录</button></div>
        <p class="small muted" style="margin:0">只显示本主机的收发（第三轮修订 13）；其它主机在各自详情页查看。${cleared?'已清理：只显示清理之后的新报文。':''}显示 ${rows.length} / 合计 ${all.length} 条。</p>`)}
      ${card('收发记录','<span class="muted small">最新在最上</span>', msgListHtml())}
      ${card('汇总','', `<div class="grid g3" style="gap:8px">
        <div class="map-item"><div class="t">${sent} 条</div><div class="d">发（主机 → 设备）</div></div>
        <div class="map-item"><div class="t">${recv} 条</div><div class="d">收（设备 → 主机）</div></div>
        <div class="map-item"><div class="t">${rows.length} / ${all.length}</div><div class="d">显示 / 合计</div></div>
      </div>
      <p class="small muted" style="margin:10px 0 0">需要完整记录请用「导出过滤结果」；导入的记录只在当前页面查看。</p>`)}
    </div>`;
  }

  if (p === 'manual') return `<div class="grid g2">
    ${card('连接操作','<span class="chip runtime">当前运行 · 仅本次有效</span>', `
      <div class="row" style="gap:8px">
        ${on?`<button class="btn" data-h="disconnect">断开连接</button>`:`<button class="btn live" data-h="connect">重新连接</button>`}
        <button class="btn" data-h="apply">按最新设置重新连接</button>
        <button class="btn" data-h="select">选用为当前主机</button></div>
      <p class="small muted" style="margin:12px 0 0">断开只关闭连接，主机仍在列表里，设置不会丢失。</p>`)}
    ${card('采集操作','', `<div class="row" style="gap:8px">
        <button class="btn" data-h="collect:${h.collectorOn?'stop':'start'}">${h.collectorOn?'停止采集':'开始采集'}</button>
        <button class="btn" data-h="collect:save">下发当前设置</button>
        <button class="btn" data-h="trace:send">发送 S2F23</button></div>
      <p class="small muted" style="margin:12px 0 0">采集的启停只作用于这一台主机。</p>`)}
    ${card('快捷发送','', `<div class="row" style="gap:7px">
        <button class="btn sm" data-h="cmd:s1f1">S1F1 握手</button>
        <button class="btn sm" data-h="cmd:s1f3">S1F3 读变量</button>
        <button class="btn sm" data-h="cmd:s2f15">S2F15 写常量</button>
        <button class="btn sm" data-h="cmd:s2f33">S2F33 定义报告</button></div>
      <textarea class="sml-box" data-hsml="1" style="margin-top:10px;min-height:82px">${esc(h.sml)}</textarea>
      <div class="row" style="margin-top:9px"><span class="spacer"></span><button class="btn host" data-h="send">发送</button></div>`)}
    ${card('收发记录','<button class="btn sm" data-h="goto:monitor">查看全部</button>',
      h.messages.length?table(['时刻','方向','消息','正文'], h.messages.slice(0,6).map(m=>[
        `<span class="mono muted">${m.at}</span>`,
        m.dir==='发送'?'<span class="tag c">发送</span>':'<span class="tag r">接收</span>',
        `<span class="mono">${esc(m.sf)}</span>`,`<span class="mono">${esc(m.body)}</span>`]))
        :'<div class="empty" style="padding:22px"><div>还没有报文，连接后可在这里发送消息。</div></div>')}
  </div>`;
  return '';
}

  const failed = state.devices.filter(d=>d.phase==='FAILED').length;
  return `<h2 class="page-title">工作台</h2><p class="page-desc">设备断开连接后仍留在列表里，可随时重新连接；删除需要单独操作并确认。</p>

    <div class="card kpi"><div class="k">已连接</div><div class="v" style="color:var(--runtime)">${on}</div><div class="d">台</div></div>
    <div class="card kpi"><div class="k">等待连接</div><div class="v" style="color:var(--warn)">${waiting}</div><div class="d">端口已开，主机未接入</div></div>
    <div class="card kpi"><div class="k">已断开${failed?' / 失败 '+failed:''}</div><div class="v" style="color:var(--muted)">${state.devices.length-on-waiting-failed}</div><div class="d">定义完整保留</div></div>
  </div>
  <div class="card" style="margin-top:12px"><div class="card-head"><h3>设备与连接</h3><span class="spacer"></span><span class="chip config">配置 v${state.configVer}</span></div>
    ${table(['设备','模板','端口','连接','配置版本','操作'], state.devices.map((d,i)=>[
      `<b>${esc(d.name)}</b>`, `<span class="tag c">${esc(d.template)}</span>`, `<span class="mono">${d.port}</span>`,
      phaseChip(d.phase),
      `<span class="mono">v${d.ver}</span>`,
      `<div class="row" style="gap:5px"><button class="btn sm" data-dev="detail:${i}">详情</button>`+
      (linkUp(d.phase)
        ? `<button class="btn sm" data-dev="disconnect:${i}">断开</button>`
        : `<button class="btn sm live" data-dev="connect:${i}">连接</button>`)+
      `<button class="btn sm" data-dev="delete:${i}">⋯</button></div>`
    ]))}
    <p class="small muted" style="margin:10px 0 0">「等待连接」表示端口已经打开、还没有主机接进来；此时点「断开」同样会释放端口。</p>
  </div>`;
}
function templatesView(){

       ['my-line','自定义产线','自定义','否','<button class="btn sm">编辑</button>']]));

/* 渲染 */
function phaseDot(phase){
  if (phase === 'CONNECTED') return 'on';
  if (phase === 'FAILED') return 'err';
  if (phase === 'LISTENING' || phase === 'CONNECTING' || phase === 'STARTING') return 'warn';
  return 'off';
}
function phaseLabel(phase){
  if (phase === 'CONNECTED') return '在线';
  if (phase === 'FAILED') return '连接失败';
  if (phase === 'LISTENING') return '等待连接';
  if (phase === 'CONNECTING' || phase === 'STARTING') return '连接中';
  return '已断开';
}
function renderNav(){
  $('#navDevices').innerHTML = state.devices.map((d,i)=>
    `<div class="dev-item ${state.view==='device'&&i===0?'active':''}" data-navdev="${i}">
      <span class="dot ${phaseDot(d.phase)}"></span>${esc(d.name)}
      <span class="count" style="margin-left:auto;color:var(--muted);font-size:10.5px">${phaseLabel(d.phase)}</span></div>`).join('');
  $('#navHosts').innerHTML = state.hosts.map((h,i)=>
    `<div class="dev-item ${state.view==='hostdetail'&&i===state.selHost?'active':''}" data-hnav="${i}">
      <span class="dot ${phaseDot(h.phase)}"></span>${esc(h.id)}
      <span class="count" style="margin-left:auto;color:var(--muted);font-size:10.5px">${phaseLabel(h.phase)}</span></div>`).join('');
  $('#navDevCount').textContent = state.devices.length;
  $('#navHostCount').textContent = state.hosts.length;
  document.querySelectorAll('.nav-item').forEach(b=>{
    const v = b.dataset.view;
    b.classList.toggle('active', v===state.view || (v==='hostlist' && state.view==='hostdetail'));
  });
}
function render(){
  renderNav();
  const zoneName = state.zone==='config'?'配置区':'运行区';
  const hzoneName = state.hzone==='config'?'配置区':'运行区';
  const crumbs = {
    device:'<b>工作台</b> / 设备 / ETCH-01 / '+zoneName,
    workbench:'<b>工作台</b>',
    hostlist:'<b>主机模拟</b>',
    hostdetail:'<b>主机模拟</b> / '+esc(curHost().id)+' / '+hzoneName,
    templates:'<b>模板管理</b>'
  };
  $('#crumb').innerHTML = crumbs[state.view] || '';

  if (state.view === 'device') {
    $('#view').innerHTML = deviceHead() + pendingBanner() + zoneBar() + subTabs() +
      `<div class="grid" style="gap:12px">${state.zone==='config'?configContent():runtimeContent()}</div>`;
  } else if (state.view === 'workbench') $('#view').innerHTML = workbenchView();
  else if (state.view === 'hostlist') $('#view').innerHTML = hostListView();
  else if (state.view === 'hostdetail') $('#view').innerHTML = hostDetailView();
  else if (state.view === 'hosttemplates') $('#view').innerHTML = hostTemplatesView();
  else $('#view').innerHTML = templatesView();

/* 交互 */
function nowLabel(){
  const d = new Date();
  return [d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':') + '.' + String(d.getMilliseconds()).padStart(3,'0');
}
function replyOf(sf){
  const m = /^S(\d+)F(\d+)/.exec(String(sf).replace(/\s/g,''));
  if (!m) return '';
  const n = Number(m[2]);
  return n % 2 === 1 ? `S${m[1]}F${n+1}` : '';
}
function pushMessage(h, sf, body, reply){
  h.messages.unshift({at:nowLabel(), dir:'发送', sf, body});
  if (reply) h.messages.unshift({at:nowLabel(), dir:'接收', sf:reply, body:'<L[1] <F4 182.4>>'});
  h.messages = h.messages.slice(0, 24);
}
function createHost(connect){
  const n = state.newHost;
  if (!n.target.trim()) { toast('请填写目标地址', 'danger'); return; }
  const port = Number(n.port);
  if (!Number.isInteger(port) || port < 1 || port > 65535) { toast('端口需为 1–65535 的整数', 'danger'); return; }
  const id = state.hostSeq < 26 ? 'HOST-' + String.fromCharCode(65 + state.hostSeq) : 'HOST-' + (state.hostSeq + 1);
  const name = n.name.trim() || '未命名主机';
  const target = n.target.trim();
  const local = target === '127.0.0.1' || target === 'localhost';
  const fresh = {
    id, name, target, port, deviceId:Number(n.deviceId)||0, note:'',
    phase:'DISCONNECTED', control:'离线',
    manual: !local, autoConnect:false, autoReconnect:false,
    retryCount:0, nextRetryAt:'', varsSource:'none', vars:[],
    settingVer:1, runningVer:1,
    collectorOn:false, samples:0, decodeErrors:0, lastRttMs:null,
    collector:{ startCeid:'', stopCeid:'', intervalMs:'1000', svids:[] },
    trace:{ trid:1, dsper:1000, totsmp:100, repgsz:1, svids:[] },
    sml:'S1F1 W', lastError:'', connectedAt:'—', messages:[]
  };
  state.hosts.push(fresh);
  state.hostSeq += 1;
  state.creating = false;
  state.newHost = { name:'', target:'', port:'5000', deviceId:'0' };
  if (connect) connectHost(fresh);
  else toast(`${id} 已创建，可继续新建更多主机`, 'host');
  render();
}
/* 连接一台主机：同一地址只允许一条链路，后来者停在「连接失败」 */
function connectHost(t){
  const holder = state.hosts.find(x => x !== t && x.phase === 'CONNECTED'
    && x.target === t.target && x.port === t.port);
  t.connectedAt = nowLabel().slice(0,8);
  if (holder) {
    t.phase = 'FAILED'; t.control = '离线';
    t.lastError = '目标已有主机连接';
    t.retryCount = t.autoReconnect ? t.retryCount + 1 : 0;
    t.nextRetryAt = t.autoReconnect ? `${Math.min(60, 5 * Math.pow(2, t.retryCount - 1))} 秒后` : '';
    toast(t.autoReconnect
      ? `${t.id} 连接失败：目标已有主机连接（${holder.id}）。${t.nextRetryAt}自动重试，${holder.id} 不受影响`
      : `${t.id} 连接失败：目标已有主机连接（${holder.id}）。已停下不再重试，${holder.id} 不受影响`, 'danger');
    return;
  }
  t.phase = 'CONNECTED'; t.control = 'ONLINE'; t.lastError = '';
  t.retryCount = 0; t.nextRetryAt = '';
  toast(`${t.id} 已连接，主机仍保留在列表中`, 'host');
}
function disconnectHost(t){
  t.phase = 'DISCONNECTED'; t.control = '离线';
  t.connectedAt = '—'; t.collectorOn = false; t.nextRetryAt = '';
  toast(`${t.id} 已断开连接，目标地址已释放，设置未改动`, 'host');
}
function hostSend(sf, body, reply){
  const h = curHost();
  if (h.phase !== 'CONNECTED') { toast(`${h.id} 尚未连接`, 'danger'); return; }
  pushMessage(h, sf, body, reply);
  toast(`${h.id}：${sf} 已发送`, 'host');
  render();
}
function hSend(){
  /* 第三轮修订 13:运行区只发本主机 */
  const h = curHost();
  if (h.phase !== 'CONNECTED') { toast(`${h.id} 尚未连接`, 'danger'); return; }
  const head = h.sml.split('\n')[0].trim() || 'SML';
  const body = h.sml.split('\n').slice(1).join(' ').trim() || '（空）';
  const reply = replyOf(head);
  pushMessage(h, head, body, reply);
  state.hSendResults = [{ result:`${head} → ${reply||'已发送'}`, detail:'8 ms' }];
  toast(`${h.id}：${head} 已发送`, 'host');
  render();
}
function rerenderKeepFocus(el){
  const isFilter = el.dataset.hfilter !== undefined;
  const key = isFilter ? el.dataset.hfilter : '';
  let pos = 0;
  try { pos = el.selectionStart ?? 0; } catch { pos = 0; }
  render();
  const sel = isFilter ? `[data-hfilter="${key}"]` : '[data-hsearch]';
  const next = document.querySelector(sel);
  if (next) {
    next.focus();
    try { next.setSelectionRange(pos, pos); } catch { /* select 无光标 */ }
  }
}
function openHostDetail(i, page){
  state.selHost = i;
  state.view = 'hostdetail';
  if (page === 'monitor') { state.hzone = 'runtime'; state.hpage.runtime = 'monitor'; }
  else { state.hzone = 'config'; state.hpage.config = 'overview'; }
  render();
}
document.addEventListener('input', (ev) => {
  const el = ev.target;
  const d = el.dataset;
  if (d.hnew !== undefined) { state.newHost[d.hnew] = el.value; return; }
  if (d.htform !== undefined) { state.htForm[d.htform] = el.value; return; }
  if (d.hsml !== undefined) { curHost().sml = el.value; return; }
  if (d.hmanual !== undefined) { state.hManualSml = el.value; return; }
  if (d.htrace !== undefined) { state.hTraceText = el.value; return; }
  if (d.alarm !== undefined) { state.alarmForm[d.alarm] = el.value; return; }
  if (d.ef !== undefined) { state.editForm[d.ef] = el.value; return; }
  if (d.msml !== undefined) { state.manualSml = el.value; return; }
  if (d.mburst !== undefined) {
    if (d.mburst === 'count') state.manualBurstCount = el.value;
    else state.manualBurstInterval = el.value;
    return;
  }
  if (d.hvar !== undefined) {
    const [field, svid] = d.hvar.split(':');
    const v = curHost().vars.find(x => x.svid === Number(svid));
    if (v && field !== 'type') { v[field] = el.value; curHost().varsSource = 'manual'; }
    return;
  }
  if (d.hsvids !== undefined) {
    curHost().collector.svids = el.value.split(/[\s,;，、]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0);
    return;
  }
  if (d.hburst !== undefined) {
    if (d.hburst === 'count') state.hBurstCount = el.value;
    else state.hBurstInterval = el.value;
    return;
  }
  if (d.hsearch !== undefined) { state.hsearch = el.value; rerenderKeepFocus(el); return; }
  if (d.hfilter !== undefined && el.tagName !== 'SELECT') {
    state.hFilter[d.hfilter] = el.value;
    rerenderKeepFocus(el);
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target, d = el.dataset;
  if (d.hfilter !== undefined && el.tagName === 'SELECT') {
    state.hFilter[d.hfilter] = el.value;
    render(); return;
  }
  if (d.alarm !== undefined) {
    state.alarmForm[d.alarm] = el.value;
    if (el.tagName === 'SELECT') render();
    return;
  }
  if (d.ef !== undefined) {
    state.editForm[d.ef] = el.value;
    if (el.tagName === 'SELECT') render();
    return;
  }
  if (d.efr !== undefined || d.efs !== undefined) {
    const id = Number(d.efr !== undefined ? d.efr : d.efs);
    const list = d.efr !== undefined ? state.editForm.reports : state.editForm.svids;
    if (el.checked) { if (!list.includes(id)) list.push(id); }
    else { const k = list.indexOf(id); if (k >= 0) list.splice(k, 1); }
    render(); return;
  }
  if (d.mceid !== undefined) { state.manualCeid = el.value; return; }
  if (d.hauto !== undefined) {
    const h = curHost();
    h.autoReconnect = el.value === '1';
    if (h.autoReconnect && h.phase === 'FAILED') { h.retryCount = 0; h.nextRetryAt = '5 秒后'; }
    if (!h.autoReconnect) h.nextRetryAt = '';
    toast(h.autoReconnect ? `${h.id} 已打开自动重连` : `${h.id} 已关闭自动重连，失败后会停下`, 'host');
    render(); return;
  }
  if (d.hvar !== undefined) {
    const [field, svid] = d.hvar.split(':');
    const h = curHost();
    const v = h.vars.find(x => x.svid === Number(svid));
    if (v) {
      v[field] = el.value;
      if (field === 'type') {
        toast(el.value ? `变量 ${svid} 已声明为 ${el.value}` : `变量 ${svid} 取消声明，按数值解析`, 'host');
        render();
      }
    }
    return;
  }
  if (d.hsel === 'tplfill') {
    /* 第三轮修订 12:新建主机时从模板一键填入 */
    const t = state.hostTemplates.find(x=>x.id===el.value);
    if (t) {
      state.newHost = { name:t.name, target:t.host, port:String(t.port), deviceId:String(t.deviceId) };
      toast(`已按模板「${t.name}」填入，可再修改`, 'config');
      render();
    }
    return;
  }
  if (d.hsel === 'preset') {
    const i = Number(el.value);
    if (Number.isInteger(i) && HOST_PRESETS[i]) {
      curHost().sml = HOST_PRESETS[i].s;
      state.hzone = 'runtime'; state.hpage.runtime = 'messages';
      toast(`已填入「${HOST_PRESETS[i].l}」，可修改后发送`);
      render();
    }
    return;
  }
  if (d.hsvid !== undefined) {
    const h = curHost();
    const list = state.hpage.config === 'trace' ? h.trace.svids : h.collector.svids;
    const id = Number(d.hsvid);
    if (el.checked) { if (!list.includes(id)) list.push(id); }
    else { const k = list.indexOf(id); if (k >= 0) list.splice(k,1); }
    render();
  }
  if (d.hsvids !== undefined) render();
});
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-view],[data-navdev],[data-zone],[data-page],[data-act],[data-plan],[data-step],[data-exec],[data-dev],[data-hzone],[data-hpage],[data-hnav],[data-h]');
  if (!el) return;
  const d = el.dataset;

  if (d.view) { state.view = d.view; render(); return; }
  if (d.navdev !== undefined) { state.view='device'; render(); return; }
  if (d.zone) { state.zone = d.zone; state.editRow = null; render(); return; }
  if (d.page) { state.page[state.zone] = d.page; state.openExec=-1; state.editRow = null; render(); return; }
  if (d.hzone) { state.hzone = d.hzone; render(); return; }
  if (d.hpage) { state.hpage[state.hzone] = d.hpage; render(); return; }
  if (d.hnav !== undefined) { openHostDetail(+d.hnav); return; }

  if (d.plan !== undefined) {
    const pl = state.plans[+d.plan]; pl.enabled = !pl.enabled;
    toast(`计划「${pl.id}」已${pl.enabled?'启用':'停用'}`);
    render(); return;
  }
  if (d.step !== undefined) { addExecution(state.plans[+d.step], true); return; }
  if (d.exec !== undefined) { state.openExec = state.openExec === +d.exec ? -1 : +d.exec; render(); return; }

  if (d.dev) {
    const [act,idx] = d.dev.split(':'); const dev = state.devices[+idx];
    if (act==='detail'){ state.view='device'; render(); return; }
    if (act==='connect'||act==='disconnect'){
      dev.phase = act==='connect'?'CONNECTED':'DISCONNECTED';
      if (idx==='0') state.link = dev.phase;
      toast(`${dev.name} 已${act==='connect'?'连接':'断开连接'}，配置未改动`);
      render(); return;
    }
    if (act==='delete'){ toast('删除设备需先断开连接，并输入设备名确认', 'danger'); return; }
  }

  /* 主机域：与设备域完全独立的动作 */
  if (d.h) {
    /* 形如 detail:0 / preset:3 的动作取冒号前的名字；形如 trace:gen 的固定动作保留全名 */
    const raw = d.h, colon = raw.indexOf(':');
    const head = colon < 0 ? raw : raw.slice(0, colon);
    const arg = colon < 0 ? '' : raw.slice(colon + 1);
    const PARAM_ACTS = new Set(['detail','goto','rowconnect','rowdisconnect','rowdelete','preset','cmd','cat','vars']);
    const act = PARAM_ACTS.has(head) ? head : raw;
    const h = curHost();
    switch (act) {
      case 'newhost': state.creating = true; state.view = 'hostlist'; render(); return;
      case 'cancelnew': state.creating = false; render(); return;
      case 'createhost': createHost(false); return;
      case 'createconnect': createHost(true); return;
      case 'htnew': state.htCreating = true; render(); return;
      case 'htcancel': state.htCreating = false; render(); return;
      case 'htsave': {
        const t = state.htForm;
        if (!t.name.trim() || !t.host.trim()) { toast('名称与目标地址必填', 'danger'); return; }
        const port = Number(t.port);
        if (!Number.isInteger(port) || port < 1 || port > 65535) { toast('端口要在 1–65535 之间', 'danger'); return; }
        state.hostTemplates.push({ id:'ht-'+Date.now().toString(36), name:t.name.trim(), host:t.host.trim(),
          port, deviceId:Number(t.deviceId)||0, collector:'', note:t.note.trim() });
        state.htForm = { name:'', host:'', port:'5000', deviceId:'0', note:'' };
        state.htCreating = false;
        toast('主机模板已保存', 'config'); render(); return;
      }
      case 'htdel': {
        const i = state.hostTemplates.findIndex(x=>x.id===arg);
        if (i >= 0) { const [t] = state.hostTemplates.splice(i,1); toast(`已删除模板「${t.name}」`, 'config'); }
        render(); return;
      }
      case 'htapply': {
        /* 第三轮修订 12:用模板新建主机(仅创建,连接仍需手动) */
        const t = state.hostTemplates.find(x=>x.id===arg);
        if (!t) return;
        const hid = 'HOST-' + state.hostSeq;
        state.hostSeq += 1;
        state.hosts.push({ id:hid, name:t.name, target:t.host, port:t.port, deviceId:t.deviceId, note:t.note,
          phase:'DISCONNECTED', control:'离线', manual:false, autoConnect:false, autoReconnect:false,
          retryCount:0, nextRetryAt:'', varsSource:'none', vars:[],
          settingVer:1, runningVer:1, collectorOn:false, samples:0, decodeErrors:0, lastRttMs:null,
          collector:{ startCeid:'', stopCeid:'', intervalMs:'1000', svids:[] },
          trace:{ trid:1, dsper:1000, totsmp:100, repgsz:1, svids:[] },
          sml:'S1F1 W', lastError:'', connectedAt:'—', messages:[] });
        state.view = 'hostlist';
        toast(`已按模板「${t.name}」创建 ${hid}（未连接，可在详情页修改并连接）`, 'host');
        render(); return;
      }
      case 'detail': case 'goto':
        if (arg === 'monitor') { state.hzone='runtime'; state.hpage.runtime='monitor'; render(); }
        else if (arg === 'collect') { state.hzone='config'; state.hpage.config='collect'; render(); }
        else openHostDetail(+arg);
        return;
      case 'auto:on':
        h.autoReconnect = true; h.retryCount = 0;
        h.nextRetryAt = h.phase==='FAILED' ? '5 秒后' : '';
        toast(`${h.id} 已打开自动重连，失败后从 5 秒起逐次加长间隔`, 'host'); render(); return;
      case 'auto:off':
        h.autoReconnect = false; h.retryCount = 0; h.nextRetryAt = '';
        toast(`${h.id} 已关闭自动重连，失败后会停在「连接失败」等你处理`, 'host'); render(); return;
      case 'vars': {
        if (arg === 'refresh') {
          if (h.phase !== 'CONNECTED') { toast('先连接目标，才能读取变量清单', 'danger'); return; }
          pushMessage(h, 'S1F11 W', '<L[0]>', 'S1F12');
          if (h.manual) {
            h.varsSource = 'manual';
            toast('目标未提供变量清单，请手动填写；连接不受影响', 'danger');
          } else {
            h.vars = SVID_CATALOG.map(([svid,vname,unit])=>{
              const old = h.vars.find(x=>x.svid===svid);
              return { svid, name:vname, unit, type: old ? old.type : '' };
            });
            h.varsSource = 'auto';
            const missing = h.vars.filter(v=>!v.type).length;
            toast(`已读回 ${h.vars.length} 个变量的名称与单位${missing?`；${missing} 个仍需声明解码类型`:''}`, 'host');
          }
          render(); return;
        }
        if (arg === 'manual') {
          h.varsSource = 'manual';
          toast('已切到手动填写：编号、名称、单位、类型都可编辑', 'host'); render(); return;
        }
        if (arg === 'add') {
          const next = h.vars.length ? Math.max(...h.vars.map(v=>v.svid)) + 1 : 1001;
          h.vars.push({ svid:next, name:'', unit:'', type:'' });
          h.varsSource = 'manual';
          toast(`已添加变量 ${next}，请填写名称与解码类型`, 'host'); render(); return;
        }
        if (arg.startsWith('del:')) {
          const svid = Number(arg.slice(4));
          h.vars = h.vars.filter(v=>v.svid!==svid);
          h.collector.svids = h.collector.svids.filter(x=>x!==svid);
          h.trace.svids = h.trace.svids.filter(x=>x!==svid);
          h.varsSource = 'manual';
          toast(`变量 ${svid} 已从本台主机的目录移除`, 'host'); render(); return;
        }
        return;
      }
      case 'rowconnect': case 'rowdisconnect': {
        const t = state.hosts[+arg];
        if (act === 'rowconnect') connectHost(t); else disconnectHost(t);
        render(); return;
      }
      case 'rowdelete': toast(`删除 ${state.hosts[+arg].id} 需先断开连接，并再次确认`, 'danger'); return;
      case 'connect': case 'disconnect':
        if (act === 'connect') connectHost(h); else disconnectHost(h);
        render(); return;
      case 'delete': toast(`删除 ${h.id} 需先断开连接，并再次确认`, 'danger'); return;
      case 'select': toast(`${h.id} 已选用为当前主机`, 'host'); render(); return;
      case 'apply':
        h.runningVer = h.settingVer;
        toast(`${h.id} 已按设置 v${h.settingVer} 重新连接，设置已生效`, 'host'); render(); return;
      case 'save':
        h.settingVer += 1;
        toast(`设置已保存为版本 v${h.settingVer}；点「使设置生效」`, 'config'); render(); return;
      case 'validate': toast('连接设置检查通过', 'config'); return;
      case 'diff': toast(`设置 v${h.runningVer} → v${h.settingVer}：采集变量与超时调整`, 'config'); return;
      case 'list:import': toast('已导入主机列表（示例）', 'host'); return;
      case 'list:export': toast('主机列表已导出', 'host'); return;
      case 'preset': {
        const p = HOST_PRESETS[+arg];
        if (p) {
          h.sml = p.s; state.hzone='runtime'; state.hpage.runtime='messages';
          toast(`已填入「${p.l}」，可修改后发送`);
          render();
        }
        return;
      }
      case 'cmd': {
        const c = HOST_COMMANDS[arg];
        if (c) hostSend(c[0], c[1], c[2]);
        return;
      }
      case 'send': hSend(); return;
      case 'results:clear': state.hSendResults = []; render(); return;
      case 'burst': {
        /* 第三轮修订 13:压测只作用于本主机 */
        if (h.phase !== 'CONNECTED') { toast(`${h.id} 尚未连接`, 'danger'); return; }
        const count = Number(state.hBurstCount);
        if (!Number.isInteger(count) || count < 1 || count > 5000) { toast('次数要在 1–5000 之间', 'danger'); return; }
        state.hBurst = [{ result:`成功 ${count} / 失败 0`, detail:'耗时 1240 ms · P50 9 ms · P95 18 ms · Max 26 ms' }];
        pushMessage(h, h.sml.split('\n')[0].trim()||'SML', '压测连发 '+count+' 条', replyOf(h.sml.split('\n')[0]));
        toast(`压测完成：已发 ${count} 条`, 'host');
        render(); return;
      }
      case 'trace:gen': state.hTraceText = buildS2F23(h); toast('已生成 S2F23'); render(); return;
      case 'trace:clear': state.hTraceText = ''; render(); return;
      case 'trace:send':
        state.hTraceText = buildS2F23(h);
        pushMessage(h, 'S2F23 W', '<L[6] …>', 'S2F24');
        state.hTraceResult = 'S2F23 → S2F24 · 12 ms\n目标设备已接受 Trace 配置';
        toast('S2F23 已发送', 'host'); render(); return;
      case 'online':
        h.control = 'ONLINE'; pushMessage(h, 'S1F17 W', '', 'S1F18');
        toast(`${h.id} 已上线`, 'host'); render(); return;
      case 'offline':
        h.control = 'OFFLINE'; pushMessage(h, 'S1F15 W', '', 'S1F16');
        toast(`${h.id} 已下线`, 'host'); render(); return;
      case 'collect:save': toast('采集设置已下发', 'host'); render(); return;
      case 'collect:start': h.collectorOn = true; toast('采集已开始', 'host'); render(); return;
      case 'collect:stop': h.collectorOn = false; toast('采集已停止', 'host'); render(); return;
      case 'collect:csv': toast(`已导出 s1f3-${h.id}.csv`, 'host'); return;
      case 'collect:import': state.hImported = `s1f3-${h.id}-sample.csv`; toast('已导入 CSV，仅本页查看', 'host'); render(); return;
      case 'collect:exit': state.hImported = null; render(); return;
      case 'manual:s1f3':
        pushMessage(h, 'S1F3 W', '<L[2] <U4 1001> <U4 1003>>', 'S1F4');
        state.hManualReply = 'S1F4 · 9 ms\n<L[2] <F4 182.4> <F4 6.5>>';
        toast('S1F3 已发送', 'host'); render(); return;
      case 'filter:clear':
        state.hFilter = { dir:'all', sf:'', kw:'', clearAt:state.hFilter.clearAt }; state.hCats = {};
        render(); return;
      case 'monitor:clear': {
        /* 第三轮修订 13:清理 = 按当前最新一条打水位,只显示之后的新报文 */
        const rows = hostMessages(h);
        state.hFilter.clearAt = rows.length ? rows[0].at : state.hFilter.clearAt;
        toast('已清理：之后只显示新收发的报文', 'host');
        render(); return;
      }
      case 'filter:export': toast(`已导出 ${filteredHostMessages().length} 条收发记录`, 'host'); return;
      case 'filter:import': toast('已导入收发记录，仅本页查看', 'host'); return;
      case 'cats:all': state.hCats = {}; render(); return;
      case 'cats:none': MSG_CATS.forEach(c=>state.hCats[c]=false); render(); return;
      case 'cat': state.hCats[arg] = state.hCats[arg] === false ? true : false; render(); return;
    }
  }

  /* 设备域：形如 cfgrpt:edit:3001 的动作取冒号前的名字，其余保留全名 */
  {
    const raw = d.act || '', colon = raw.indexOf(':');
    const head = colon < 0 ? raw : raw.slice(0, colon);
    const arg = colon < 0 ? '' : raw.slice(colon + 1);
    const PARAM_ACTS = new Set(['cfgrpt','cfgceid','rtceid','rtrpt','svid','alarm','edit']);
    const act = PARAM_ACTS.has(head) ? head : raw;
    const [verb, idText] = arg.includes(':') ? [arg.slice(0, arg.indexOf(':')), arg.slice(arg.indexOf(':')+1)] : [arg, ''];
    const id = Number(idText);

    if (head === 'cfgrpt' || head === 'cfgceid' || head === 'rtceid' || head === 'rtrpt' || head === 'svid') {
      const kind = head === 'svid' ? 'svid' : head;
      const rows = catalogRows(kind);
      const key = catalogKey(kind);
      const noun = catalogNoun(kind);
      if (verb === 'new' || verb === 'edit') {
        if (kind.startsWith('rt') && state.link !== 'CONNECTED') { toast('先连接主机，才能改本次运行的定义', 'danger'); return; }
        openCatalogEditor(kind, verb === 'new' ? null : id);
        render(); return;
      }
      if (verb === 'del') {
        const k = rows.findIndex(r => r[key] === id);
        if (k < 0) return;
        rows.splice(k, 1);
        if (kind === 'svid') {
          state.cfgReports.forEach(r => { r.svids = r.svids.filter(x => x !== id); });
          toast(`变量 ${id} 已从设备定义移除，引用它的报告已同步去掉该变量`, 'config');
        } else if (kind === 'cfgceid') {
          toast(`事件 ${id} 已从设备定义移除，保存后重载生效`, 'config');
        } else if (kind === 'cfgrpt') {
          toast(`报告 ${id} 已从设备定义移除；仍绑定它的事件会发出空报告体`, 'config');
        } else if (kind === 'rtceid') {
          toast(`事件 ${id} 已从本次运行移除，引用它的计划本次会记为「已跳过」`);
        } else {
          toast(`报告 ${id} 已从本次运行移除；仍绑定它的事件会发出空报告体`);
        }
        render(); return;
      }
      if (verb === 'fire') {
        const c = state.rtCeids.find(x => x.ceid === id);
        if (!c) return;
        addExecution({ id:'手动 · '+c.name, ceid:id, actions:['事件报告 · CEID '+id], effects:[], fires:0, skipped:0 }, false);
        return;
      }
      return;
    }

    switch (act) {
      case 'disconnect':
        state.link='DISCONNECTED'; state.devices[0].phase='DISCONNECTED';
        toast('连接已断开，端口已释放，设备仍在工作台里'); render(); break;
      case 'connect':
        state.link='CONNECTED'; state.devices[0].phase='CONNECTED';
        toast('已重新连接，运行恢复'); render(); break;
      case 'reload':
        state.runningVer = state.configVer;
        resetRuntimeCatalog();
        state.alarms = [];
        state.editRow = null;
        toast(`已重载到版本 v${state.configVer}，本次运行临时改的事件、报告与报警已按配置恢复`); render(); break;
      case 'save':
        state.configVer += 1;
        toast(`配置已保存为版本 v${state.configVer}；点击「重载使生效」`, 'config'); render(); break;
      case 'validate': toast('配置校验通过', 'config'); break;
      case 'delete': toast('删除设备需先断开连接，并输入设备名确认', 'danger'); break;
      case 'diff': toast(`版本 v${state.runningVer} → v${state.configVer}：新增 1 条报警消息、修改 1 项变量变化`, 'config'); break;
      case 'revisions': state.zone='config'; state.page.config='revisions'; render(); break;
      case 'newplan': toast('新建计划：填写触发规则、发送内容与变量变化'); break;
      case 'pauseall': state.plans.forEach(p=>p.enabled=false); toast('全部计划已停用'); render(); break;
      case 'export': toast('执行记录已导出'); break;
      case 'onlyfailed': state.onlyFailed = !state.onlyFailed; render(); break;
      case 'showdry': state.showDryRun = !state.showDryRun; render(); break;
      case 'send': {
        const first = String(state.manualSml).trim().split('\n')[0] || '报文';
        toast(`${first} 已发送`); break;
      }
      case 'trigger': {
        const ceid = Number(state.manualCeid);
        const c = state.rtCeids.find(x => x.ceid === ceid);
        if (!c) { toast('请先选择要触发的事件', 'danger'); return; }
        addExecution({ id:'手动 · '+c.name, ceid, actions:['事件报告 · CEID '+ceid], effects:[], fires:0, skipped:0 }, false);
        break;
      }
      case 'alarm': {
        const a = state.alarmForm;
        const alid = Number(a.alid);
        if (!Number.isInteger(alid) || alid < 0) { toast('ALID 需为非负整数', 'danger'); return; }
        if (verb === 'rowclear') {
          state.alarms = state.alarms.filter(x => x.alid !== id);
          toast(`报警 ${id} 已清除，S5F1 已发送`); render(); break;
        }
        if (verb === 'clear') {
          if (!state.alarms.some(x => x.alid === alid)) { toast(`报警 ${alid} 当前未置位，仍会发送清除报文`); }
          state.alarms = state.alarms.filter(x => x.alid !== alid);
          toast(`报警 ${alid} 已清除，S5F1（ALCD 最高位 0）已发送`); render(); break;
        }
        const text = String(a.text).trim() || `ALARM ${alid}`;
        const hit = state.alarms.find(x => x.alid === alid);
        if (hit) { hit.text = text; hit.category = Number(a.category); hit.at = nowLabel().slice(0,8); }
        else state.alarms.unshift({ alid, text, category:Number(a.category), at:nowLabel().slice(0,8) });
        toast(`报警 ${alid} 已置位，S5F1（ALCD 最高位 1）已发送`); render(); break;
      }
      case 'burst': {
        const count = Number(state.manualBurstCount);
        const gap = Number(state.manualBurstInterval);
        if (!Number.isInteger(count) || count < 1 || count > 5000) { toast('次数要在 1–5000 之间', 'danger'); return; }
        if (!Number.isInteger(gap) || gap < 0 || gap > 60000) { toast('间隔要在 0–60000 ms 之间', 'danger'); return; }
        const first = String(state.manualSml).trim().split('\n')[0] || '报文';
        const ok = Math.max(0, count - Math.floor(count / 50));
        const total = count * (gap + 9);
        state.manualBurstResult = `${first} × ${count}\n成功 ${ok} · 失败 ${count-ok}\n耗时 ${total} ms · P50 9 ms · P95 14 ms · Max 31 ms`;
        toast(`压测完成：${count} 条，成功 ${ok} 条`); render(); break;
      }
      case 'step': addExecution(state.plans[0], true); break;
      case 'online':
        state.controlState = 'ONLINE';
        toast('设备已上线，S1F17 已发送，开始主动上报'); render(); break;
      case 'offline':
        state.controlState = 'OFFLINE';
        toast('设备已下线，S1F15 已发送，主动上报停止'); render(); break;
      case 'edit':
        if (verb === 'save') saveCatalogEditor();
        else { state.editRow = null; render(); }
        break;
    }
  }
});

/* 启用后按计划发送消息并执行变量变化；试跑走同一流程但不计数、不推进倒计时 */
function addExecution(plan, dryRun){
  const skipped = state.link !== 'CONNECTED';
  const before = state.svid, after = 250.0;
  const changes = (skipped || !plan.effects.length) ? []
    : [['1001',before.toFixed(1),after.toFixed(1)],['1003','4.2','6.5'],['1101','40','60']];
  if (!skipped && changes.length) {
    state.svid = after;
    state.series = [...state.series.slice(-14), before, after];
  }
  state.executions.unshift({
    at:nowLabel(), plan:plan.id, ceid:plan.ceid, dryRun:!!dryRun,
    status: skipped ? '已跳过' : '已发送',
    msgs: skipped ? 0 : plan.actions.length,
    effects: changes.length,
    sml: skipped ? '未连接主机，本次跳过（不发送消息、不改变变量）'
      : `S6F11 W <L[3] <U4 0> <U4 ${plan.ceid}> <L[1] <L[2] <U4 3001> <L[3] <F4 ${after.toFixed(1)}> … >>>>` + (dryRun?'  （试跑）':''),
    before: changes
  });
  if (!dryRun) { if (skipped) plan.skipped += 1; else plan.fires += 1; }
  state.executions = state.executions.slice(0, 20);
  toast(dryRun ? `「${plan.id}」试跑完成：不计入触发数，也不推进倒计时`
    : skipped ? `「${plan.id}」已跳过：未连接主机，不发消息也不改变量`
    : `「${plan.id}」已触发：消息已发送，变量已更新`);
  if (state.view === 'device' && state.zone === 'runtime') render();
}
setInterval(() => {
  if (state.link === 'CONNECTED') {
    const active = state.plans.find(p => p.enabled && p.id === '加工开始');
    if (active) addExecution(active, false);
  }
}, 9000);

resetRuntimeCatalog();
render();
</script>
