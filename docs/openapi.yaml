openapi: 3.0.3
info:
  title: SECS Simulator HTTP API
  version: 2.0.0
  description: |
    SECS/GEM 模拟器的 REST + SSE 接口。

    内部工具，不做鉴权：所有端点直连可调用，没有令牌、账号或登录，也不回 401/403。

    SSE 不能设置请求头，先用 `POST /api/v1/ticket` 换一次性票据，
    再连 `GET /api/v1/events?ticket=...`。
servers:
  - url: http://127.0.0.1:5000
    description: 默认本机地址
tags:
  - name: health
  - name: events
  - name: sessions
  - name: control
  - name: host-sims
  - name: preview
  - name: messages
  - name: configs
  - name: devices
  - name: audit
  - name: admin
  - name: system
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: 存活与运行信息
      responses:
        '200':
          description: 服务存活。带凭据时额外返回版本、形态、会话数与身份。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/ticket:
    post:
      tags: [events]
      summary: 换取一次性 SSE 票据
      description: 票据 30 秒有效、只能用一次（只为绕过 EventSource 不能带请求头的限制）。
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema:
                type: object
                required: [ok, ticket, expiresInMs]
                properties:
                  ok: { type: boolean }
                  ticket: { type: string }
                  user: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  expiresInMs: { type: integer, format: int64 }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/events:
    get:
      tags: [events]
      summary: SSE 报文事件流
      description: |
        使用 `POST /api/v1/ticket` 的一次性票据；不接受长期 token 查询参数。
        事件名：`message`（报文）、`heartbeat`（时间戳）。
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string }
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 会话列表
      responses:
        '200':
          description: 会话数组
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
    post:
      tags: [sessions]
      summary: 新建会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: 已创建
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/bulk:
    post:
      tags: [sessions]
      summary: 批量新建会话
      description: 从一份设备配置模板批量开多台；第 i 台会话 id = 前缀+i、端口 = 起始+i−1、device-id = 起始+i−1。逐台独立创建；只要有一台失败就回 207（可能全部失败），并逐台给原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBulkRequest'
      responses:
        '201':
          description: 全部创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBulkResult'
        '207':
          description: 有失败（可能全部失败，逐台给原因）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/log-level:
    get:
      tags: [system]
      summary: 当前日志级别
      responses:
        '200':
          description: 级别
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum: [error, info, debug]
    put:
      tags: [system]
      summary: 运行时切换日志级别（记审计）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [error, info, debug]
      responses:
        '200':
          description: 已切换
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      summary: 关闭并移除会话
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 已关闭
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/reload:
    post:
      tags: [sessions]
      summary: 按配置重载会话
      description: 配置有错时旧会话保持原样，只返回失败。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 已重载
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 演示会话没有配置来源（not-reloadable）
  /api/v1/sessions/{id}/ceid/{ceid}:
    post:
      tags: [control]
      summary: 手动触发一次 S6F11
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: ceid
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '202':
          description: 已接受
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机（session-not-open）
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{id}/alarm/{alid}:
    post:
      tags: [control]
      summary: 置位/清除报警（S5F1）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: alid
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: set
          in: query
          schema: { type: boolean, default: true }
        - name: text
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: integer, minimum: 1, maximum: 7, default: 1 }
      responses:
        '202':
          description: 已接受
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机（session-not-open）
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{id}/alarms:
    get:
      tags: [sessions]
      summary: 当前活动报警
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 报警数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alarm' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/terminal:
    get:
      tags: [sessions]
      summary: 最近终端消息（S10F3）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 终端消息数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TerminalMessage' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/catalog:
    get:
      tags: [sessions]
      summary: SVID / RPTID / CEID 目录
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/events:
    get:
      tags: [control]
      summary: 事件编排列表
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 计划数组
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventPlan' }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [control]
      summary: 新增编排计划（运行时,不写回配置）
      description: |
        计划 JSON:{"id","ceid","trigger":{"type":"at|periodic|onCondition|afterEvent",...},"effects":[...]}。
        trigger 字段随 type:at→atMs;periodic→periodMs/jitterMs;
        onCondition→expression/debounceMs;afterEvent→sourcePlan/delayMs。
        效果元素 {"svid","op":"set|add|pulse|shift|resume",...}。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 计划不合法(原因在 error) }
        '404': { description: 会话不存在 }
        '409': { description: 计划 id 已存在 }
  /api/v1/sessions/{id}/events/{planId}:
    post:
      tags: [control]
      summary: 运行时启用/禁用一个编排计划
      description: 只影响当前进程；重载会恢复配置里的状态。禁用期间的事件不补发。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 已切换
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: unknown-session 或 unknown-plan
    put:
      tags: [control]
      summary: 更新编排计划（运行时）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200': { description: 已更新 }
        '400': { description: 计划不合法 }
        '404': { description: 会话或计划不存在 }
    delete:
      tags: [control]
      summary: 删除编排计划（连同待触发队列与去抖状态）
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或计划不存在 }
  /api/v1/sessions/{id}/message:
    post:
      tags: [control]
      summary: 手动发送一条 SML 报文
      description: |
        请求体就是 SML 原文。支持 SxFy/W、L/A/B/BOOLEAN、I*/U*/F*。
        W 位同步等待 T3；超时返回 `timedOut=true` 而不是发送失败。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 65536
              example: |
                S1F1 W.
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentMessageResult' }
        '400':
          description: bad-sml / empty-sml / body-too-large
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/preview:
    get:
      tags: [preview]
      summary: 曲线预览（JSON，分桶 min/max/avg；v6 起支持 svids 过滤与事件标记）
      parameters:
        - $ref: '#/components/parameters/SessionQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Buckets'
        - name: svids
          in: query
          required: false
          description: 只返回这些 SVID（逗号分隔绝对 id）；缺省返回全部（上限 32 条）
          schema: { type: string }
        - name: withEvents
          in: query
          required: false
          description: 是否附带窗口内的确定性事件标记（v6）；默认 true
          schema: { type: boolean, default: true }
        - name: plan
          in: query
          required: false
          description: |
            只回放这一条编排计划（planId）；缺省回放全部启用计划。
            效果从窗口之前的历史开始重放，窗口内仍在生效的 set/shift 也会体现在曲线上。
          schema: { type: string }
      responses:
        '200':
          description: 分桶预览。v6 起 events 数组带窗口内事件（at/ceid/planId），效果已叠加进曲线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewData' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/preview.bin:
    get:
      tags: [preview]
      summary: 曲线预览（SCSP v1 二进制）
      description: |
        小端；48 字节固定头 + 每条序列的 svid 与 min/max/avg f64 数组。
        格式见 `docs/preview-binary.md`。
      parameters:
        - $ref: '#/components/parameters/SessionQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Buckets'
      responses:
        '200':
          description: 二进制正文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/overview:
    get:
      tags: [sessions]
      summary: 工作台聚合（v6）
      description: |
        全部会话的状态/速率/计数一览：state、controlState、hasPeer、counters、
        msgsPerMin / s6f11PerMin（60 秒滑动窗口）、lastEventAt、hostSim 占用、uptimeMs。
      responses:
        '200':
          description: 每会话一个片段
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/OverviewRow' }
  /api/v1/sessions/{id}/burst:
    get:
      tags: [control]
      summary: 压测进度 / 最近一次结果（v6）
      description: |
        压测是后台任务：POST 受理后回 202，用这里的 GET 轮询进度与统计。
        该会话没跑过压测时回 `{"ok":true,"running":false,"accepted":false}`。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 运行中给 running/count/startedAt；已结束给最近一次完整统计
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurstStatus' }
        '404':
          description: unknown-session
    post:
      tags: [control]
      summary: 服务端压测（v6）
      description: |
        同一条报文/事件在服务端循环发送（消除 HTTP 往返失真）。后台执行，
        受理即回 202（带 accepted/running 与全 0 统计），真实统计随后用
        `GET /api/v1/sessions/{id}/burst` 取；同一会话同时只允许一个压测。
        kind=message 需要 sml；kind=ceid 需要 ceid（走手动上报路径，不受
        events.maxPerSec 限制）；kind=alarm 交替置位/清除。count 上限 5000，
        intervalMs 上限 60000。总时长超预算时中止剩余条目（skipped/aborted）。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [message, ceid, alarm] }
                count: { type: integer, minimum: 1, maximum: 5000, default: 1 }
                intervalMs: { type: integer, minimum: 0, maximum: 60000, default: 0 }
                sml: { type: string, description: kind=message 必填 }
                ceid: { type: integer, minimum: 1, description: kind=ceid 必填 }
                alid: { type: integer, minimum: 1, description: kind=alarm 必填 }
                text: { type: string }
                category: { type: integer, minimum: 1, maximum: 7, default: 4 }
      responses:
        '202':
          description: 后台已受理（accepted=true，统计字段为 0，随后用 GET 取）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurstResult' }
        '400': { description: bad-body / bad-request / unknown-kind / count-out-of-range / interval-out-of-range / missing-sml / missing-ceid / missing-alid / unsupported-session }
        '404':
          description: unknown-session
        '409': { description: 该会话已有压测在跑（burst-running）或执行器队列满（burst-busy） }
  /api/v1/sessions/{id}/ceids:
    post:
      tags: [control]
      summary: 新增采集事件（运行时;CEID 重复回 409）
      description: '事件 JSON:{"id","slot","reports":[RPTID...],"owner"?}。绑定报告属于事件设置页。'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 定义不合法(原因在 error) }
        '404': { description: 会话不存在 }
        '409': { description: CEID 已存在 }
  /api/v1/sessions/{id}/ceids/{ceid}:
    put:
      tags: [control]
      summary: 更新采集事件（事件名/绑定报告）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ceid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或事件不存在 }
    delete:
      tags: [control]
      summary: 删除采集事件
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ceid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或事件不存在 }
  /api/v1/sessions/{id}/reports:
    post:
      tags: [control]
      summary: 新增报告（运行时;RPTID 重复回 409）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 报告不合法 }
        '404': { description: 会话不存在 }
        '409': { description: RPTID 已存在 }
  /api/v1/sessions/{id}/reports/{rptid}:
    put:
      tags: [control]
      summary: 更新报告（变量列表等）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rptid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或报告不存在 }
    delete:
      tags: [control]
      summary: 删除报告
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rptid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或报告不存在 }
  /api/v1/sessions/{id}/svids:
    post:
      tags: [control]
      summary: 新增状态变量（运行时;默认绑定恒 0 曲线,可用值设定钉住）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 变量不合法 }
        '404': { description: 会话不存在 }
        '409': { description: SVID 已存在 }
  /api/v1/sessions/{id}/svids/{svid}:
    put:
      tags: [control]
      summary: 更新状态变量（符号名/归属/类型/单位）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或变量不存在 }
    delete:
      tags: [control]
      summary: 删除状态变量（连同其值绑定）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或变量不存在 }
  /api/v1/sessions/{id}/svids/{svid}/value:
    put:
      tags: [control]
      summary: 「设定」状态变量的值（钉住,覆盖曲线与事件效果）
      description: '请求体 {"value": <number>}。钉住直到取消设定或会话重载。'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已设定 }
        '404': { description: 会话或变量不存在 }
    delete:
      tags: [control]
      summary: 取消「设定」
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已取消 }
        '404': { description: 会话不存在 }
  /api/v1/sessions/{id}/host-sim:
    get:
      tags: [control]
      summary: 主机模拟连接状态
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 未连接时 open=false；已连接时带 target 描述与模式
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: boolean }
                  target: { type: string }
                  mode: { type: string, enum: [local, remote] }
                  remote: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [control]
      summary: 以主机角色打开到该会话（或远程 SECS）的连接
      description: |
        请求体可省略：省略时连本机设备。给 `host` 表示远程目标，
        此时 `port` 必须是 1-65535；`deviceId` 缺省为 0。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                port: { type: integer }
                deviceId: { type: integer }
      responses:
        '201': { description: 已连接 }
        '400': { description: bad-target（host 为空或 port 不在 1-65535） }
        '404':
          $ref: '#/components/responses/NotFound'
        '409': { description: 设备已有主机（设备只接受一个主机），或已处于连接状态（host-busy-or-sim-open） }
        '502': { description: 连接失败（open-failed） }
    delete:
      tags: [control]
      summary: 断开主机模拟连接
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已断开 }
  /api/v1/sessions/{id}/host-sim/send:
    post:
      tags: [control]
      summary: 以主机角色发送一条 SML（等 T3 应答）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: 发送结果（含应答报文与耗时）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentMessageResult' }
        '409': { description: 主机模拟未连接 }
  /api/v1/sessions/{id}/host-sim/collector:
    post:
      tags: [control]
      summary: 下发主机模拟 S1F3 采集器配置（v6）
      description: |
        收到 startCeid 的 S6F11 开始按 intervalMs 轮询 S1F3，收到 stopCeid 停止。
        本机模式校验 SVID 存在；远程模式（host-sim 以 target 打开时）不做存在性校验。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectorConfig' }
      responses:
        '200': { description: 已下发 }
        '400': { description: 配置非法（error=invalid-collector-config，人话原因在 message） }
        '404': { description: 主机模拟未开启（host-sim-not-open） }
    get:
      tags: [control]
      summary: 采集器状态与数据（v6）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: running/samples/series（每 SVID 的 t[]/v[] 环形,上限 3600 点）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorState' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/host-sim/collector/start:
    post:
      tags: [control]
      summary: 手动启动采集器（v6；正常流程由 startCeid 的 S6F11 触发）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已启动 }
        '404': { description: 主机模拟未开启（host-sim-not-open） }
        '409': { description: 还没有采集配置（collector-not-configured，原因在 message） }
  /api/v1/sessions/{id}/host-sim/collector/stop:
    post:
      tags: [control]
      summary: 手动停止采集器（v6）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已停止 }
        '404': { description: 主机模拟未开启（host-sim-not-open） }
        '409': { description: 还没有采集配置（collector-not-configured，原因在 message） }
  /api/v2/devices/{id}/config/revisions:
    get:
      tags: [devices]
      summary: 设备配置版本历史
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: 版本历史数组 }
        '404': { description: 设备不存在 }
  /api/v2/devices/{id}/runtime/executions:
    get:
      tags: [devices]
      summary: 事件计划执行台账（新→旧；缺省不含单步试跑）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: planId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [SENT, PARTIAL, FAILED, SKIPPED] } }
        - { name: dryRun, in: query, schema: { type: string, enum: ['0', '1', 'all'] } }
      responses:
        '200': { description: 台账数组（items/count；含 messages 与 effects） }
        '400': { description: limit 越界 }
  /api/v2/devices/{id}/runtime/plans/{planId}/step:
    post:
      tags: [devices]
      summary: 单步试跑计划（台账 dry_run=1，不计 fire_count、不推进倒计时）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: planId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已触发一次 }
        '404': { description: 设备不存在 }
        '409': { description: 设备离线 }
        '500': { description: 计划不存在或发送失败 }
  /api/v2/devices/{id}/runtime/plans/{planId}/enabled:
    post:
      tags: [devices]
      summary: 运行时启停计划并持久化到 runtime.db
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, default: true }
      responses:
        '200': { description: 已更新（内存调度器 + runtime_plan_state） }
        '400': { description: 计划不存在或请求体非法 }
        '404': { description: 设备不存在 }
    put:
      tags: [devices]
      summary: 同 POST（设计 §2.5 GET/PUT 契约的写路径）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: planId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean, default: true }
      responses:
        '200': { description: 已更新 }
        '400': { description: 计划不存在或请求体非法 }
        '404': { description: 设备不存在 }
  /api/v2/devices/{id}/link:
    get:
      tags: [devices]
      summary: 设备链路相位（内存相位优先，缺省回落到 device_link 行）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{deviceId, phase, controlState, lastError, configRevision, connectedAt, disconnectedAt}' }
        '404': { description: 设备不存在（既没有会话也没有 device_link 行） }
  /api/v2/devices/{id}/link/{action}:
    post:
      tags: [devices]
      summary: 连接 / 断开 / 重载设备链路（只动链路，不动配置与运行态编辑）
      description: |
        connect 幂等：已经连上时直接返回 200。disconnect 只断链不销毁设备，
        钉值、计划启用态、运行时目录编辑全部保留，再 connect 时原样恢复。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [connect, disconnect, reload] }
      responses:
        '200': { description: 已执行 }
        '404': { description: 设备不存在 / action 未知 }
        '405': { description: 方法不是 POST/PUT }
        '409': { description: 该设备不可重载（没有配置来源） }
        '502': { description: 连接失败（端口占用、对端拒绝等） }
    put:
      tags: [devices]
      summary: 同 POST（设计 §2.5 GET/PUT 契约的写路径）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [connect, disconnect, reload] }
      responses:
        '200': { description: 已执行 }
        '404': { description: 设备不存在 / action 未知 }
  /api/v2/hosts:
    get:
      tags: [host-sims]
      summary: 主机实例列表（3.0：主机是与设备无关的独立实体）
      responses:
        '200': { description: 实例数组（含持久行与链路相位） }
    post:
      tags: [host-sims]
      summary: 新建主机实例（只填目标地址，与设备无关）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [host, port]
              properties:
                name: { type: string }
                host: { type: string }
                port: { type: integer }
                deviceId: { type: integer }
                autoReconnect: { type: boolean }
      responses:
        '201': { description: 已创建（body 带 hostId） }
        '400': { description: 目标非法 }
  /api/v2/hosts/{hostId}:
    get:
      tags: [host-sims]
      summary: 单主机状态（相位 / 设置版本 / 收发错误）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 状态 }
        '404': { description: 主机不存在 }
    delete:
      tags: [host-sims]
      summary: 删除主机（显式销毁；建议先断开）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除 }
        '404': { description: 主机不存在 }
  /api/v2/hosts/{hostId}/connect:
    post:
      tags: [host-sims]
      summary: 建链
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果 }
  /api/v2/hosts/{hostId}/disconnect:
    post:
      tags: [host-sims]
      summary: 只断链（实例与设置保留）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果 }
  /api/v2/hosts/{hostId}/apply:
    post:
      tags: [host-sims]
      summary: 使设置生效（按最新设置重连）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 结果 }
  /api/v2/hosts/{hostId}/send:
    post:
      tags: [host-sims]
      summary: 以主机角色发送 SML
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sml]
              properties:
                sml: { type: string }
      responses:
        '200': { description: 发送结果 }
        '404': { description: 主机不存在 }
  /api/v2/hosts/{hostId}/messages:
    get:
      tags: [host-sims]
      summary: 该实例独立的收发记录（perspective=host）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
      responses:
        '200': { description: 报文数组 }
  /api/v2/hosts/{hostId}/variables:
    post:
      tags: [host-sims]
      summary: 从目标读取变量目录（S1F11 → S1F12；类型仍需声明）
      parameters:
        - { name: hostId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 读取结果（目标不支持时 ok=false 且连接不受影响） }
  /api/v2/host-templates:
    get:
      tags: [host-sims]
      summary: 主机实例模板列表
      responses:
        '200': { description: 模板数组 }
    post:
      tags: [host-sims]
      summary: 新建（或带 id 更新）主机模板
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, host, port]
              properties:
                id: { type: string }
                name: { type: string }
                host: { type: string }
                port: { type: integer }
                deviceId: { type: integer }
                note: { type: string }
      responses:
        '201': { description: 已保存 }
  /api/v2/host-templates/{templateId}:
    delete:
      tags: [host-sims]
      summary: 删除主机模板
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 已删除 }
        '404': { description: 模板不存在 }
  /api/v1/host-sims:
    get:
      tags: [host-sims]
      summary: 全部主机实例（多主机）
      description: 每台设备可以有多个主机实例：本机设备与远程 SECS 各自独立，实例之间互不影响。
      responses:
        '200':
          description: 实例数组；一个都没开时是空数组
          content:
            application/json:
              schema:
                type: object
                required: [hosts]
                properties:
                  hosts:
                    type: array
                    items: { $ref: '#/components/schemas/HostSimInstance' }
        '404':
          description: 后端不支持多主机（not-supported）
    post:
      tags: [host-sims]
      summary: 新建一个主机实例（连本机设备或远程 SECS）
      description: |
        `session` 必填。给 `host` 就是远程目标（此时 `port` 必须 1-65535）；
        不给 `host` 就连本机设备，且一台设备只允许一个本机主机。
        `hostId` 可选，会进 URL 路径，因此不能含 `/` 或 `\`；缺省由后端分配 `host-N`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostSimOpenRequest' }
      responses:
        '201': { description: 已连接 }
        '400': { description: bad-body / missing-session / bad-port / bad-host-id }
        '404': { description: unknown-session }
        '409': { description: 设备已有主机，或该实例 id 已存在（host-busy-or-sim-open） }
        '502': { description: 连接失败（open-failed） }
  /api/v1/host-sims/{hostId}:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [host-sims]
      summary: 单个主机实例状态
      responses:
        '200':
          description: 实例状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimInstance' }
        '404':
          description: unknown-host
    delete:
      tags: [host-sims]
      summary: 断开并移除主机实例
      responses:
        '200': { description: 已断开 }
        '404':
          description: unknown-host
  /api/v1/host-sims/{hostId}/send:
    post:
      tags: [host-sims]
      summary: 以主机角色发送一条 SML（等 T3 应答）
      parameters:
        - $ref: '#/components/parameters/HostId'
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: 发送结果（含应答报文与耗时）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentMessageResult' }
        '400': { description: bad-body / SML 解析失败 }
        '404': { description: unknown-host }
        '409': { description: 主机实例未连接（host-sim-not-open） }
        '502': { description: 发送失败（send-failed） }
  /api/v1/host-sims/{hostId}/collector:
    parameters:
      - $ref: '#/components/parameters/HostId'
    get:
      tags: [host-sims]
      summary: 该实例的 S1F3 采集器状态与数据（v6）
      responses:
        '200':
          description: configured/running/samples/series（每 SVID 的 t[]/v[] 环形，上限 3600 点）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorState' }
        '404': { description: unknown-host }
    post:
      tags: [host-sims]
      summary: 下发该实例的 S1F3 采集器配置（v6）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectorConfig' }
      responses:
        '200':
          description: 已下发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '400':
          description: 配置非法（error=invalid-collector-config，人话原因在 message）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '404':
          description: 实例不存在（host-sim-not-open）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
  /api/v1/host-sims/{hostId}/collector/start:
    post:
      tags: [host-sims]
      summary: 手动启动该实例的采集器（v6）
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '200':
          description: 已启动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '404':
          description: 实例不存在（host-sim-not-open）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '409':
          description: 还没有采集配置（collector-not-configured，原因在 message）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
  /api/v1/host-sims/{hostId}/collector/stop:
    post:
      tags: [host-sims]
      summary: 手动停止该实例的采集器（v6）
      parameters:
        - $ref: '#/components/parameters/HostId'
      responses:
        '200':
          description: 已停止
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '404':
          description: 实例不存在（host-sim-not-open）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
        '409':
          description: 还没有采集配置（collector-not-configured，原因在 message）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostSimCommandResult' }
  /api/v1/messages:
    get:
      tags: [messages]
      summary: 最近报文历史（支持 before 游标与报文类型过滤）
      description: |
        内存保留最近 5000 条;`format=jsonl` 返回可下载的 JSON Lines。
        `before` 是翻旧账的游标:只返回时间早于该 epoch 毫秒的报文,
        配合 `stream`/`function` 可以只翻某一类报文的历史。
      parameters:
        - name: session
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
        - name: format
          in: query
          schema: { type: string, enum: [json, jsonl], default: json }
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: 只取时间早于该值的消息;缺省不限制
        - name: stream
          in: query
          schema: { type: integer }
        - name: function
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: JSON 历史或 JSONL 附件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
            application/x-ndjson:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: 报文日志不可用
  /api/v1/configs:
    get:
      tags: [configs]
      summary: 配置目录列表
      responses:
        '200':
          description: 配置文件数组
          content:
            application/json:
              schema:
                type: object
                required: [configs]
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigEntry' }
    post:
      tags: [configs]
      summary: 新建配置
      description: |
        按内置设备模板生成一份能直接编译的起点。template 取
        GET /api/v1/config-templates 里的 id，缺省/空骨架为 bare。
        未知模板按 400 拒绝（problems 里带可用模板清单），不静默退回骨架。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: line1.json }
                template: { type: string, default: bare, example: etch }
      responses:
        '201':
          description: 已创建（ok 包络与领域字段 name 并列,是该命令端点的既有约定）
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok: { type: boolean }
                  name: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/config-templates:
    get:
      tags: [configs]
      summary: 内置设备模板目录
      responses:
        '200':
          description: 模板数组（id 可用于 POST /api/v1/configs 的 template 字段）
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigTemplateEntry' }
  /api/v1/templates:
    get:
      tags: [configs]
      summary: 模板列表（内置 + 自定义）
      responses:
        '200':
          description: 模板数组
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigTemplateEntry' }
    post:
      tags: [configs]
      summary: 新建自定义模板
      description: '体:{"id":"my-etch","text":"<完整设备配置 JSON>"}。内置模板 id 只读，不能覆盖。'
      responses:
        '200': { description: 已保存 }
        '400': { description: 配置校验失败或 id 非法 }
        '409': { description: 内置模板只读 }
  /api/v1/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [configs]
      summary: 读模板原文（内置模板生成一份 device.json 副本）
      responses:
        '200':
          description: '{id,text}'
          content:
            application/json:
              schema:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
        '404': { description: 模板不存在 }
    put:
      tags: [configs]
      summary: 更新自定义模板（体就是模板 JSON 原文）
      responses:
        '200': { description: 已保存 }
        '400': { description: 校验失败 }
        '409': { description: 内置模板只读 }
    delete:
      tags: [configs]
      summary: 删除自定义模板
      responses:
        '200': { description: 已删除 }
        '404': { description: 模板不存在 }
        '409': { description: 内置模板不能删除 }
  /api/v1/configs/{name}:
    get:
      tags: [configs]
      summary: 读配置原文（带 modifiedMs 快照）
      parameters:
        - $ref: '#/components/parameters/ConfigName'
      responses:
        '200':
          description: 配置原文与其修改时间快照（存盘时经 If-Match 带回做并发保护）
          content:
            application/json:
              schema:
                type: object
                required: [name, text]
                properties:
                  name: { type: string }
                  text: { type: string }
                  modifiedMs: { type: integer, format: int64, description: 最后修改时间（epoch 毫秒） }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [configs]
      summary: 校验通过后原子保存配置（支持 If-Match 并发保护）
      description: |
        请求头可带 `If-Match: <modifiedMs>`（取自 GET 响应的 modifiedMs）。
        文件在这期间被其他窗口/进程修改过时回 409，不落盘；
        不带 If-Match 的旧客户端行为不变。校验不过回 422（问题清单随响应带回）。
      parameters:
        - $ref: '#/components/parameters/ConfigName'
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: GET 响应里的 modifiedMs；与当前不一致时回 409
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200':
          description: 已保存（ok 包络与领域字段 name 并列）
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok: { type: boolean }
                  name: { type: string }
        '400':
          description: 名字非法时回 problems（ok/valid/problems，无 error）；If-Match 不是数字时回 error=bad-if-match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
        '409':
          description: 配置在编辑期间被其他操作修改过（If-Match 不一致），未落盘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
        '422':
          description: 配置校验失败，未落盘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
        '500':
          description: 写盘失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
  /api/v1/configs/{name}/validate:
    post:
      tags: [configs]
      summary: 只校验不落盘
      parameters:
        - $ref: '#/components/parameters/ConfigName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200':
          description: 校验结果（valid 为 false 时 problems 非空）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
  /api/v1/config-preview:
    post:
      tags: [preview]
      summary: 按配置草稿文本算曲线预览（不落盘、不需要运行中的会话）
      description: |
        给编辑器的草稿预览用：编译草稿并按模拟时间轴分桶，编译失败回 422。
        withEvents=false 时只画默认曲线，不模拟事件时间线。
        from/to 可缺省，默认 0..60000 毫秒（草稿没有运行时态，时间窗是相对模拟时钟的）。
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: integer, format: int64, default: 0 }
        - name: to
          in: query
          required: false
          schema: { type: integer, format: int64, default: 60000 }
        - name: buckets
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
        - name: svids
          in: query
          required: false
          schema: { type: string }
          description: 逗号分隔的 SVID 列表;缺省画全部
        - name: withEvents
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 分桶曲线数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewData' }
        '400':
          description: bad-query（from/to/buckets 不是整数）/ bad-range（to ≤ from）/ bad-buckets（不在 1..500）/ bad-body / bad-svids
        '422': { description: 配置编译不过 }
  /api/v1/audit:
    get:
      tags: [audit]
      summary: 最近审计记录（支持 action/actor 服务端过滤）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: action
          in: query
          schema: { type: string }
          description: 精确匹配动作名（如 config-save）；缺省不过滤
        - name: actor
          in: query
          schema: { type: string }
          description: 精确匹配操作者；缺省不过滤
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: 只取时间早于该值（epoch 毫秒）的记录,翻旧账的游标;缺省不限制
      responses:
        '200':
          description: 审计数组（total 是过滤后的总数,truncated 表示被 limit 截断）
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  limit: { type: integer }
                  total: { type: integer }
                  truncated: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: 审计日志不可用
  /api/v1/shutdown:
    post:
      tags: [admin]
      summary: 优雅停机
      responses:
        '200':
          description: 正在停机
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionQuery:
      name: session
      in: query
      required: true
      schema: { type: string }
    From:
      name: from
      in: query
      schema: { type: integer, format: int64, default: 0 }
    To:
      name: to
      in: query
      schema: { type: integer, format: int64, default: 60000 }
    Buckets:
      name: buckets
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
    ConfigName:
      name: name
      in: path
      required: true
      schema: { type: string, example: line1.json }
    HostId:
      name: hostId
      in: path
      required: true
      description: 主机实例 id（`host-1` 之类，由新建时指定或后端分配）
      schema: { type: string, example: host-1 }
  responses:
    NotFound:
      description: 目标不存在（404）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 冲突（409）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 请求不合法（400）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: 方法不允许（405）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 内部错误（500）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role:
      type: string
      enum: [viewer, operator, admin]
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: forbidden }
        required: { type: string, example: OPERATOR }
        message: { type: string }
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        version: { type: string }
        mode: { type: string }
        sessions: { type: integer }
        uptimeMs: { type: integer, format: int64 }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        vm: { type: string }
        utf8: { type: boolean }
    Counters:
      type: object
      additionalProperties: { type: integer, format: int64 }
    SessionSummary:
      type: object
      required: [id, state, device, units]
      properties:
        id: { type: string }
        state:
          type: string
          description: HSMS 会话状态
          example: OPEN
        controlState:
          type: string
          enum: [OFFLINE, COMMUNICATING, ONLINE]
        device: { type: string }
        units: { type: integer }
        lastError: { type: string }
        config: { type: string, description: 装载时用的配置文件名;演示会话等无来源时为空串 }
        counters: { $ref: '#/components/schemas/Counters' }
    Alarm:
      type: object
      required: [alid, category, text, atMillis]
      properties:
        alid: { type: integer }
        category: { type: integer, minimum: 1, maximum: 7 }
        text: { type: string }
        atMillis: { type: integer, format: int64 }
    TerminalMessage:
      type: object
      required: [tid, text, atMillis]
      properties:
        tid: { type: integer }
        text: { type: string }
        atMillis: { type: integer, format: int64 }
    Catalog:
      type: object
      required: [ceids, reports, svids]
      properties:
        ceids:
          type: array
          items:
            type: object
            properties:
              ceid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              reports:
                type: array
                items: { type: integer }
              source: { type: string, enum: [local, host] }
              enabled: { type: boolean }
        reports:
          type: array
          items:
            type: object
            properties:
              rptid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              svids:
                type: array
                items: { type: integer }
              source: { type: string, enum: [local, host] }
        svids:
          type: array
          items:
            type: object
            properties:
              svid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              type: { type: string }
              unit: { type: string }
              pinned: { type: boolean, description: 是否被「设定」钉住(值设定接口的真值回显) }
        hostReports: { type: integer }
        hostLinks: { type: integer }
        hostAllDisabled: { type: boolean }
    EventPlan:
      type: object
      required: [id, ceid, enabled, triggerType]
      properties:
        id: { type: string }
        ceid: { type: integer }
        owner:
          type: string
          description: 归属单元（由所引用 CEID 的归属反查，只读；未知时为空串）
        enabled: { type: boolean }
        triggerType:
          type: string
          enum: [at, periodic, onCondition, afterEvent]
        atMs: { type: integer, format: int64 }
        periodMs: { type: integer, format: int64 }
        jitterMs: { type: integer, format: int64 }
        expression: { type: string }
        debounceMs: { type: integer, format: int64 }
        sourcePlan: { type: string }
        delayMs: { type: integer, format: int64 }
    PreviewSeries:
      type: object
      required: [svid, min, max, avg]
      properties:
        svid: { type: integer }
        owner: { type: string }
        unit: { type: string }
        min:
          type: array
          items: { type: number, format: double }
        max:
          type: array
          items: { type: number, format: double }
        avg:
          type: array
          items: { type: number, format: double }
    PreviewData:
      type: object
      required: [from, to, buckets, bucketMs, series]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        buckets: { type: integer }
        bucketMs: { type: integer, format: int64 }
        svidTotal: { type: integer }
        truncated: { type: boolean }
        series:
          type: array
          items: { $ref: '#/components/schemas/PreviewSeries' }
        events:
          type: array
          description: 窗口内的确定性事件标记（v6；草稿预览为模拟时间线）
          items:
            type: object
            properties:
              at: { type: integer, format: int64 }
              ceid: { type: integer }
              planId: { type: string }
    OverviewRow:
      type: object
      description: 工作台聚合里的单会话片段（v6）
      properties:
        id: { type: string }
        state: { type: string }
        controlState: { type: string }
        hasPeer: { type: boolean }
        device: { type: string }
        units: { type: integer }
        port: { type: integer }
        counters:
          type: object
          additionalProperties: { type: integer, format: int64 }
        msgsPerMin: { type: integer }
        s6f11PerMin: { type: integer }
        lastEventAt: { type: integer, format: int64 }
        uptimeMs: { type: integer, format: int64 }
        hostSim: { type: boolean }
    BurstResult:
      type: object
      description: 服务端压测受理/统计（v6）
      properties:
        ok: { type: boolean }
        accepted: { type: boolean, description: 后台任务已受理 }
        running: { type: boolean }
        count: { type: integer, description: 本次请求的循环次数 }
        sent: { type: integer }
        failed: { type: integer }
        skipped: { type: integer, description: 超出总时长预算而未执行 }
        aborted: { type: boolean, description: 是否因超预算中止 }
        durationMs: { type: integer, format: int64 }
        latencyP50: { type: integer }
        latencyP95: { type: integer }
        latencyMax: { type: integer }
    BurstStatus:
      description: GET /sessions/{id}/burst 的回包：运行中只有进度，结束后是最近一次统计
      allOf:
        - $ref: '#/components/schemas/BurstResult'
        - type: object
          properties:
            startedAt: { type: integer, format: int64, description: 运行中时的开始时间（epoch 毫秒） }
    CollectorConfig:
      type: object
      description: 主机模拟 S1F3 采集器配置（v6）
      required: [startCeid, stopCeid, svids]
      properties:
        startCeid: { type: integer }
        stopCeid: { type: integer }
        intervalMs: { type: integer, default: 1000, minimum: 200 }
        svids:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
              name: { type: string }
              unit: { type: string }
    CollectorState:
      type: object
      description: 采集器状态与数据（v6）
      properties:
        configured: { type: boolean }
        running: { type: boolean }
        mode: { type: string, enum: [local, remote] }
        startCeid: { type: integer }
        stopCeid: { type: integer }
        intervalMs: { type: integer }
        samples: { type: integer }
        decodeErrors: { type: integer }
        lastRttMs: { type: integer }
        svids:
          type: array
          description: 已配置的采集 SVID(id 与名称)
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        staleSvids:
          type: array
          items: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              svid: { type: integer }
              name: { type: string }
              unit: { type: string }
              t:
                type: array
                items: { type: integer, format: int64 }
              v:
                type: array
                items: { type: number }
    MessagePage:
      type: object
      required: [messages, total, limit, truncated]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string }
              direction: { type: string, enum: [in, out] }
              stream: { type: integer }
              function: { type: integer }
              wbit: { type: boolean }
              body: { type: string }
              at: { type: integer, format: int64 }
        total: { type: integer }
        limit: { type: integer }
        truncated: { type: boolean }
    SentMessageResult:
      type: object
      required: [ok, stream, function, wbit, sentSml, timedOut, elapsedMs]
      properties:
        ok: { type: boolean }
        stream: { type: integer }
        function: { type: integer }
        wbit: { type: boolean }
        sentSml: { type: string }
        timedOut: { type: boolean }
        replyStream: { type: integer }
        replyFunction: { type: integer }
        replyWbit: { type: boolean }
        replySml:
          type: string
          nullable: true
        elapsedMs: { type: integer, format: int64 }
    ConfigEntry:
      type: object
      required: [name, sizeBytes, modifiedMs]
      properties:
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modifiedMs: { type: integer, format: int64 }
    ConfigProblems:
      type: object
      description: 校验/保存失败的问题清单；没有 `error` 字段
      required: [valid, problems]
      properties:
        ok: { type: boolean, description: 与 valid 同值（ok 包络） }
        valid: { type: boolean }
        problems:
          type: array
          items: { type: string }
    HostSimInstance:
      type: object
      description: 一个主机实例（多主机：同一台设备可开多个，各自独立）
      required: [id, session, open, target, port, deviceId, mode, remote]
      properties:
        id: { type: string, example: host-1 }
        session: { type: string, description: 宿主会话 id }
        open: { type: boolean }
        target: { type: string, description: '目标地址 `host:port`' }
        port: { type: integer }
        deviceId: { type: integer }
        mode: { type: string, enum: [local, remote] }
        remote: { type: boolean, description: local = 连本机设备；remote = 连远程 SECS }
        lastError: { type: string }
    HostSimOpenRequest:
      type: object
      required: [session]
      properties:
        session: { type: string, description: 本机设备的会话 id }
        host: { type: string, description: 远程 SECS 主机地址；不给就连本机设备 }
        port: { type: integer, minimum: 1, maximum: 65535, description: 给 host 时必填 }
        deviceId: { type: integer, default: 0 }
        hostId: { type: string, description: 实例 id；会进 URL 路径，不能含 `/` 或 `\` }
    HostSimCommandResult:
      type: object
      description: 主机实例命令的统一回包
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string, description: 稳定的错误代码（ok=false 时给出，如 invalid-collector-config / host-sim-not-open） }
        message: { type: string, description: 给人看的原因；界面优先显示它 }
    ConfigTemplateEntry:
      type: object
      description: 内置设备模板目录里的一项
      required: [id, label, description]
      properties:
        id: { type: string, example: etch }
        label: { type: string, example: 刻蚀腔 }
        description: { type: string, example: 温场/射频/腔压曲线 + 过热与腔压异常事件 }
        source: { type: string, enum: [builtin, custom] }
        sizeBytes: { type: integer, format: int64 }
        modifiedMs: { type: integer, format: int64 }
    AuditEntry:
      type: object
      required: [at, actor, role, action, target, detail]
      properties:
        at: { type: integer, format: int64 }
        actor: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        action: { type: string }
        target: { type: string }
        detail: { type: string }

    SessionCreateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: string
          description: "`demo` 或 --work-dir 下的配置文件名（不接受路径）"
        sessionId:
          type: string
          description: 部署期覆盖：会话 id；不填用配置里的
        bindHost:
          type: string
          description: 部署期覆盖：绑定地址
        port:
          type: integer
          description: 部署期覆盖：HSMS 端口（1-65535）
        deviceId:
          type: integer
          description: 部署期覆盖：device-id
    SessionBulkRequest:
      type: object
      required: [config, count]
      properties:
        config:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 100
        sessionIdPrefix:
          type: string
          default: dev-
        portBase:
          type: integer
          description: 0 表示都用配置里的端口
        deviceIdBase:
          type: integer
        bindHost:
          type: string
    SessionBulkResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              error:
                type: string
