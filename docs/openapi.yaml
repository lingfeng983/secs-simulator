openapi: 3.0.3
info:
  title: SECS Simulator HTTP API
  version: 2.0.0-SNAPSHOT
  description: |
    SECS/GEM 模拟器的 REST + SSE 接口。

    鉴权使用 `Authorization: Bearer <token>`。角色按能力递增：
    `viewer` 只读，`operator` 可改变设备状态，`admin` 可停机与查看审计。
    未认证回 401，认证通过但角色不够回 403。

    SSE 不能设置请求头，先用 `POST /api/v1/ticket` 换一次性票据，
    再连 `GET /api/v1/events?ticket=...`。
servers:
  - url: http://127.0.0.1:5000
    description: 默认本机地址
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: events
  - name: sessions
  - name: control
  - name: preview
  - name: messages
  - name: configs
  - name: audit
  - name: admin
  - name: system
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: 存活与运行信息
      security: []
      responses:
        '200':
          description: 服务存活。带凭据时额外返回版本、形态、会话数与身份。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/ticket:
    post:
      tags: [auth]
      summary: 换取一次性 SSE 票据
      description: 票据 30 秒有效、只能用一次；返回签发身份与角色。
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema:
                type: object
                required: [ok, ticket, expiresInMs]
                properties:
                  ok: { type: boolean }
                  ticket: { type: string }
                  user: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  expiresInMs: { type: integer, format: int64 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /api/v1/events:
    get:
      tags: [events]
      summary: SSE 报文事件流
      description: |
        使用 `POST /api/v1/ticket` 的一次性票据；不接受长期 token 查询参数。
        事件名：`message`（报文）、`heartbeat`（时间戳）。
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: 会话列表
      responses:
        '200':
          description: 会话数组
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [sessions]
      summary: 新建会话
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
      responses:
        '201':
          description: 已创建
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/sessions/bulk:
    post:
      tags: [sessions]
      summary: 批量新建会话
      description: 从一份设备配置模板批量开多台；第 i 台会话 id = 前缀+i、端口 = 起始+i−1、device-id = 起始+i−1。逐台独立创建，部分失败回 207。
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionBulkRequest'
      responses:
        '201':
          description: 全部创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBulkResult'
        '207':
          description: 部分失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBulkResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/log-level:
    get:
      tags: [system]
      summary: 当前日志级别
      x-required-role: viewer
      responses:
        '200':
          description: 级别
          content:
            application/json:
              schema:
                type: object
                properties:
                  level:
                    type: string
                    enum: [error, info, debug]
    put:
      tags: [system]
      summary: 运行时切换日志级别（记审计）
      x-required-role: operator
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [error, info, debug]
      responses:
        '200':
          description: 已切换
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/sessions/{id}:
    delete:
      tags: [sessions]
      summary: 关闭并移除会话
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 已关闭
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/reload:
    post:
      tags: [sessions]
      summary: 按配置重载会话
      description: 配置有错时旧会话保持原样，只返回失败。
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 已重载
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 演示会话没有配置来源（not-reloadable）
  /api/v1/sessions/{id}/ceid/{ceid}:
    post:
      tags: [control]
      summary: 手动触发一次 S6F11
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: ceid
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '202':
          description: 已接受
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机（session-not-open）
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{id}/alarm/{alid}:
    post:
      tags: [control]
      summary: 置位/清除报警（S5F1）
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: alid
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: set
          in: query
          schema: { type: boolean, default: true }
        - name: text
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: integer, minimum: 0, maximum: 7, default: 1 }
      responses:
        '202':
          description: 已接受
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机（session-not-open）
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/sessions/{id}/alarms:
    get:
      tags: [sessions]
      summary: 当前活动报警
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 报警数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alarm' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/terminal:
    get:
      tags: [sessions]
      summary: 最近终端消息（S10F3）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 终端消息数组
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TerminalMessage' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/catalog:
    get:
      tags: [sessions]
      summary: SVID / RPTID / CEID 目录
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/events:
    get:
      tags: [control]
      summary: 事件编排列表
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 计划数组
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/EventPlan' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/events/{planId}:
    post:
      tags: [control]
      summary: 运行时启用/禁用一个编排计划
      description: 只影响当前进程；重载会恢复配置里的状态。禁用期间的事件不补发。
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: planId
          in: path
          required: true
          schema: { type: string }
        - name: enabled
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 已切换
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: unknown-session 或 unknown-plan
  /api/v1/sessions/{id}/message:
    post:
      tags: [control]
      summary: 手动发送一条 SML 报文
      description: |
        请求体就是 SML 原文。支持 SxFy/W、L/A/B/BOOLEAN、I*/U*/F*。
        W 位同步等待 T3；超时返回 `timedOut=true` 而不是发送失败。
      x-required-role: operator
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              maxLength: 65536
              example: |
                S1F1 W.
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentMessageResult' }
        '400':
          description: bad-sml / empty-sml / body-too-large
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话未打开或没有主机
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/preview:
    get:
      tags: [preview]
      summary: 曲线预览（JSON，分桶 min/max/avg；v6 起支持 svids 过滤与事件标记）
      parameters:
        - $ref: '#/components/parameters/SessionQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Buckets'
        - name: svids
          in: query
          required: false
          description: 只返回这些 SVID（逗号分隔绝对 id）；缺省返回全部（上限 32 条）
          schema: { type: string }
        - name: withEvents
          in: query
          required: false
          description: 是否附带窗口内的确定性事件标记（v6）；默认 true
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 分桶预览。v6 起 events 数组带窗口内事件（at/ceid/planId），效果已叠加进曲线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewData' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/preview.bin:
    get:
      tags: [preview]
      summary: 曲线预览（SCSP v1 二进制）
      description: |
        小端；48 字节固定头 + 每条序列的 svid 与 min/max/avg f64 数组。
        格式见 `docs/preview-binary.md`。
      parameters:
        - $ref: '#/components/parameters/SessionQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Buckets'
      responses:
        '200':
          description: 二进制正文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/overview:
    get:
      tags: [sessions]
      summary: 工作台聚合（v6）
      description: |
        全部会话的状态/速率/计数一览：state、controlState、hasPeer、counters、
        msgsPerMin / s6f11PerMin（60 秒滑动窗口）、lastEventAt、hostSim 占用、uptimeMs。
      responses:
        '200':
          description: 每会话一个片段
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/OverviewRow' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sessions/{id}/burst:
    post:
      tags: [control]
      summary: 服务端压测（v6）
      description: |
        同一条报文/事件在服务端循环发送（消除 HTTP 往返失真）。
        kind=message 需要 sml；kind=ceid 需要 ceid（走手动上报路径，不受
        events.maxPerSec 限制）；kind=alarm 交替置位/清除。count 上限 5000。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, count]
              properties:
                kind: { type: string, enum: [message, ceid, alarm] }
                count: { type: integer, minimum: 1, maximum: 5000 }
                intervalMs: { type: integer, minimum: 0, default: 0 }
                sml: { type: string }
                ceid: { type: integer }
                alid: { type: integer }
                text: { type: string }
                category: { type: integer, minimum: 1, maximum: 7 }
      responses:
        '200':
          description: 压测统计（sent/failed/durationMs/latencyP50/P95/Max）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BurstResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/events:
    post:
      tags: [control]
      summary: 新增编排计划（运行时,不写回配置）
      x-required-role: operator
      description: |
        计划 JSON:{"id","ceid","trigger":{"type":"at|periodic|onCondition|afterEvent",...},"effects":[...]}。
        trigger 字段随 type:at→atMs;periodic→periodMs/jitterMs;
        onCondition→expression/debounceMs;afterEvent→sourcePlan/delayMs。
        效果元素 {"svid","op":"set|add|pulse|shift|resume",...}。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 计划不合法(原因在 error) }
        '404': { description: 会话不存在 }
        '409': { description: 计划 id 已存在 }
  /api/v1/sessions/{id}/events/{planId}:
    put:
      tags: [control]
      summary: 更新编排计划（运行时）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: planId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200': { description: 已更新 }
        '400': { description: 计划不合法 }
        '404': { description: 会话或计划不存在 }
    delete:
      tags: [control]
      summary: 删除编排计划（连同待触发队列与去抖状态）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: planId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或计划不存在 }
  /api/v1/sessions/{id}/ceids:
    post:
      tags: [control]
      summary: 新增采集事件（运行时;CEID 重复回 409）
      x-required-role: operator
      description: '事件 JSON:{"id","slot","reports":[RPTID...],"owner"?}。绑定报告属于事件设置页。'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 定义不合法(原因在 error) }
        '404': { description: 会话不存在 }
        '409': { description: CEID 已存在 }
  /api/v1/sessions/{id}/ceids/{ceid}:
    put:
      tags: [control]
      summary: 更新采集事件（事件名/绑定报告）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ceid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或事件不存在 }
    delete:
      tags: [control]
      summary: 删除采集事件
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: ceid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或事件不存在 }
  /api/v1/sessions/{id}/reports:
    post:
      tags: [control]
      summary: 新增报告（运行时;RPTID 重复回 409）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 报告不合法 }
        '404': { description: 会话不存在 }
        '409': { description: RPTID 已存在 }
  /api/v1/sessions/{id}/reports/{rptid}:
    put:
      tags: [control]
      summary: 更新报告（变量列表等）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rptid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或报告不存在 }
    delete:
      tags: [control]
      summary: 删除报告
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: rptid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或报告不存在 }
  /api/v1/sessions/{id}/svids:
    post:
      tags: [control]
      summary: 新增状态变量（运行时;默认绑定恒 0 曲线,可用值设定钉住）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '201': { description: 已新增 }
        '400': { description: 变量不合法 }
        '404': { description: 会话不存在 }
        '409': { description: SVID 已存在 }
  /api/v1/sessions/{id}/svids/{svid}:
    put:
      tags: [control]
      summary: 更新状态变量（符号名/归属/类型/单位）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已更新 }
        '404': { description: 会话或变量不存在 }
    delete:
      tags: [control]
      summary: 删除状态变量（连同其值绑定）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已删除 }
        '404': { description: 会话或变量不存在 }
  /api/v1/sessions/{id}/svids/{svid}/value:
    put:
      tags: [control]
      summary: 「设定」状态变量的值（钉住,覆盖曲线与事件效果）
      x-required-role: operator
      description: '请求体 {"value": <number>}。钉住直到取消设定或会话重载。'
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已设定 }
        '404': { description: 会话或变量不存在 }
    delete:
      tags: [control]
      summary: 取消「设定」
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: svid
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 已取消 }
        '404': { description: 会话不存在 }
  /api/v1/sessions/{id}/host-sim:
    get:
      tags: [control]
      summary: 主机模拟连接状态
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 未连接时 open=false；已连接时带 target 描述与模式
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: boolean }
                  target: { type: string }
                  mode: { type: string, enum: [local, remote] }
                  remote: { type: boolean }
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [control]
      summary: 以主机角色打开到该会话（或远程 SECS）的连接
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string }
                port: { type: integer }
                deviceId: { type: integer }
      responses:
        '200': { description: 已连接 }
        '409': { description: 设备已有主机（设备只接受一个主机），或已处于连接状态 }
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [control]
      summary: 断开主机模拟连接
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已断开 }
  /api/v1/sessions/{id}/host-sim/send:
    post:
      tags: [control]
      summary: 以主机角色发送一条 SML（等 T3 应答）
      x-required-role: operator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        '200':
          description: 发送结果（含应答报文与耗时）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SentMessageResult' }
        '409': { description: 主机模拟未连接 }
  /api/v1/sessions/{id}/host-sim/collector:
    post:
      tags: [control]
      summary: 下发主机模拟 S1F3 采集器配置（v6）
      description: |
        收到 startCeid 的 S6F11 开始按 intervalMs 轮询 S1F3，收到 stopCeid 停止。
        本机模式校验 SVID 存在；远程模式（host-sim 以 target 打开时）不做存在性校验。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectorConfig' }
      responses:
        '200': { description: 已下发 }
        '400': { description: 配置非法 }
        '409': { description: 主机模拟未开启 }
    get:
      tags: [control]
      summary: 采集器状态与数据（v6）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: running/samples/series（每 SVID 的 t[]/v[] 环形,上限 3600 点）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectorState' }
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/sessions/{id}/host-sim/collector/start:
    post:
      tags: [control]
      summary: 手动启动采集器（v6；正常流程由 startCeid 的 S6F11 触发）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已启动 }
        '409': { description: 未配置或未连接 }
  /api/v1/sessions/{id}/host-sim/collector/stop:
    post:
      tags: [control]
      summary: 手动停止采集器（v6）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 已停止 }
  /api/v1/messages:
    get:
      tags: [messages]
      summary: 最近报文历史（支持 before 游标与报文类型过滤）
      description: |
        内存保留最近 5000 条;`format=jsonl` 返回可下载的 JSON Lines。
        `before` 是翻旧账的游标:只返回时间早于该 epoch 毫秒的报文,
        配合 `stream`/`function` 可以只翻某一类报文的历史。
      parameters:
        - name: session
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
        - name: format
          in: query
          schema: { type: string, enum: [json, jsonl], default: json }
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: 只取时间早于该值的消息;缺省不限制
        - name: stream
          in: query
          schema: { type: integer }
        - name: function
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: JSON 历史或 JSONL 附件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
            application/x-ndjson:
              schema: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: 报文日志不可用
  /api/v1/configs:
    get:
      tags: [configs]
      summary: 配置目录列表
      responses:
        '200':
          description: 配置文件数组
          content:
            application/json:
              schema:
                type: object
                required: [configs]
                properties:
                  configs:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [configs]
      summary: 新建配置
      description: |
        按内置设备模板生成一份能直接编译的起点。template 取
        GET /api/v1/config-templates 里的 id，缺省/空骨架为 bare。
        未知模板按 400 拒绝（problems 里带可用模板清单），不静默退回骨架。
      x-required-role: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: line1.json }
                template: { type: string, default: bare, example: etch }
      responses:
        '201':
          description: 已创建（ok 包络与领域字段 name 并列,是该命令端点的既有约定）
          content:
            application/json:
              schema:
                type: object
                required: [ok, name]
                properties:
                  ok: { type: boolean }
                  name: { type: string }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/config-templates:
    get:
      tags: [configs]
      summary: 内置设备模板目录
      responses:
        '200':
          description: 模板数组（id 可用于 POST /api/v1/configs 的 template 字段）
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/ConfigTemplateEntry' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/configs/{name}:
    get:
      tags: [configs]
      summary: 读配置原文（带 modifiedMs 快照）
      parameters:
        - $ref: '#/components/parameters/ConfigName'
      responses:
        '200':
          description: 配置原文与其修改时间快照（存盘时经 If-Match 带回做并发保护）
          content:
            application/json:
              schema:
                type: object
                required: [name, text]
                properties:
                  name: { type: string }
                  text: { type: string }
                  modifiedMs: { type: integer, format: int64, description: 最后修改时间（epoch 毫秒） }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [configs]
      summary: 校验通过后原子保存配置（支持 If-Match 并发保护）
      x-required-role: operator
      description: |
        请求头可带 `If-Match: <modifiedMs>`（取自 GET 响应的 modifiedMs）。
        文件在这期间被其他窗口/进程修改过时回 409，不落盘；
        不带 If-Match 的旧客户端行为不变。校验不过回 422（问题清单随响应带回）。
      parameters:
        - $ref: '#/components/parameters/ConfigName'
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: GET 响应里的 modifiedMs；与当前不一致时回 409
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200':
          description: 已保存
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 配置在编辑期间被其他操作修改过（If-Match 不一致），未落盘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
        '422':
          description: 配置校验失败，未落盘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
  /api/v1/configs/{name}/validate:
    post:
      tags: [configs]
      summary: 只校验不落盘
      parameters:
        - $ref: '#/components/parameters/ConfigName'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: string }
      responses:
        '200':
          description: 校验结果（valid 为 false 时 problems 非空）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigProblems' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/config-preview:
    post:
      tags: [preview]
      summary: 按配置草稿文本算曲线预览（不落盘、不需要运行中的会话）
      x-required-role: viewer
      description: |
        给编辑器的草稿预览用：编译草稿并按模拟时间轴分桶，编译失败回 422。
        withEvents=false 时只画默认曲线，不模拟事件时间线。
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: to
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: buckets
          in: query
          schema: { type: integer, default: 120 }
        - name: svids
          in: query
          required: false
          schema: { type: string }
          description: 逗号分隔的 SVID 列表;缺省画全部
        - name: withEvents
          in: query
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 分桶曲线数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewData' }
        '422': { description: 配置编译不过 }
  /api/v1/audit:
    get:
      tags: [audit]
      summary: 最近审计记录（支持 action/actor 服务端过滤）
      x-required-role: admin
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: action
          in: query
          schema: { type: string }
          description: 精确匹配动作名（如 config-save）；缺省不过滤
        - name: actor
          in: query
          schema: { type: string }
          description: 精确匹配操作者；缺省不过滤
        - name: before
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: 只取时间早于该值（epoch 毫秒）的记录,翻旧账的游标;缺省不限制
      responses:
        '200':
          description: 审计数组（total 是过滤后的总数,truncated 表示被 limit 截断）
          content:
            application/json:
              schema:
                type: object
                required: [audit]
                properties:
                  audit:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
                  limit: { type: integer }
                  total: { type: integer }
                  truncated: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 审计日志不可用
  /api/v1/shutdown:
    post:
      tags: [admin]
      summary: 优雅停机
      x-required-role: admin
      responses:
        '200':
          description: 正在停机
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 访问令牌或账号口令
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SessionQuery:
      name: session
      in: query
      required: true
      schema: { type: string }
    From:
      name: from
      in: query
      schema: { type: integer, format: int64, default: 0 }
    To:
      name: to
      in: query
      schema: { type: integer, format: int64, default: 60000 }
    Buckets:
      name: buckets
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 120 }
    ConfigName:
      name: name
      in: path
      required: true
      schema: { type: string, example: line1.json }
  responses:
    Unauthorized:
      description: 未认证（401）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 角色不足（403）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 目标不存在（404）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 冲突（409）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: 请求不合法（400）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      description: 方法不允许（405）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: 内部错误（500）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Role:
      type: string
      enum: [viewer, operator, admin]
    Error:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: forbidden }
        required: { type: string, example: OPERATOR }
        message: { type: string }
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        version: { type: string }
        mode: { type: string }
        sessions: { type: integer }
        uptimeMs: { type: integer, format: int64 }
        user: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        vm: { type: string }
        utf8: { type: boolean }
    Counters:
      type: object
      additionalProperties: { type: integer, format: int64 }
    SessionSummary:
      type: object
      required: [id, state, device, units]
      properties:
        id: { type: string }
        state:
          type: string
          description: HSMS 会话状态
          example: OPEN
        controlState:
          type: string
          enum: [OFFLINE, COMMUNICATING, ONLINE]
        device: { type: string }
        units: { type: integer }
        lastError: { type: string }
        config: { type: string, description: 装载时用的配置文件名;演示会话等无来源时为空串 }
        counters: { $ref: '#/components/schemas/Counters' }
    Alarm:
      type: object
      required: [alid, category, text, atMillis]
      properties:
        alid: { type: integer }
        category: { type: integer, minimum: 0, maximum: 7 }
        text: { type: string }
        atMillis: { type: integer, format: int64 }
    TerminalMessage:
      type: object
      required: [tid, text, atMillis]
      properties:
        tid: { type: integer }
        text: { type: string }
        atMillis: { type: integer, format: int64 }
    Catalog:
      type: object
      required: [ceids, reports, svids]
      properties:
        ceids:
          type: array
          items:
            type: object
            properties:
              ceid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              reports:
                type: array
                items: { type: integer }
              source: { type: string, enum: [local, host] }
              enabled: { type: boolean }
        reports:
          type: array
          items:
            type: object
            properties:
              rptid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              svids:
                type: array
                items: { type: integer }
              source: { type: string, enum: [local, host] }
        svids:
          type: array
          items:
            type: object
            properties:
              svid: { type: integer }
              owner: { type: string }
              slot: { type: string }
              type: { type: string }
              unit: { type: string }
              pinned: { type: boolean, description: 是否被「设定」钉住(值设定接口的真值回显) }
        hostReports: { type: integer }
        hostLinks: { type: integer }
        hostAllDisabled: { type: boolean }
    EventPlan:
      type: object
      required: [id, ceid, enabled, triggerType]
      properties:
        id: { type: string }
        ceid: { type: integer }
        enabled: { type: boolean }
        triggerType:
          type: string
          enum: [at, periodic, onCondition, afterEvent]
        atMs: { type: integer, format: int64 }
        periodMs: { type: integer, format: int64 }
        jitterMs: { type: integer, format: int64 }
        expression: { type: string }
        debounceMs: { type: integer, format: int64 }
        sourcePlan: { type: string }
        delayMs: { type: integer, format: int64 }
    PreviewSeries:
      type: object
      required: [svid, min, max, avg]
      properties:
        svid: { type: integer }
        owner: { type: string }
        unit: { type: string }
        min:
          type: array
          items: { type: number, format: double }
        max:
          type: array
          items: { type: number, format: double }
        avg:
          type: array
          items: { type: number, format: double }
    PreviewData:
      type: object
      required: [from, to, buckets, bucketMs, series]
      properties:
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        buckets: { type: integer }
        bucketMs: { type: integer, format: int64 }
        svidTotal: { type: integer }
        truncated: { type: boolean }
        series:
          type: array
          items: { $ref: '#/components/schemas/PreviewSeries' }
        events:
          type: array
          description: 窗口内的确定性事件标记（v6；草稿预览为模拟时间线）
          items:
            type: object
            properties:
              at: { type: integer, format: int64 }
              ceid: { type: integer }
              planId: { type: string }
    OverviewRow:
      type: object
      description: 工作台聚合里的单会话片段（v6）
      properties:
        id: { type: string }
        state: { type: string }
        controlState: { type: string }
        hasPeer: { type: boolean }
        device: { type: string }
        units: { type: integer }
        port: { type: integer }
        counters:
          type: object
          additionalProperties: { type: integer, format: int64 }
        msgsPerMin: { type: integer }
        s6f11PerMin: { type: integer }
        lastEventAt: { type: integer, format: int64 }
        uptimeMs: { type: integer, format: int64 }
        hostSim: { type: boolean }
    BurstResult:
      type: object
      description: 服务端压测统计（v6）
      properties:
        sent: { type: integer }
        failed: { type: integer }
        durationMs: { type: integer, format: int64 }
        latencyP50: { type: integer }
        latencyP95: { type: integer }
        latencyMax: { type: integer }
    CollectorConfig:
      type: object
      description: 主机模拟 S1F3 采集器配置（v6）
      required: [startCeid, stopCeid, svids]
      properties:
        startCeid: { type: integer }
        stopCeid: { type: integer }
        intervalMs: { type: integer, default: 1000, minimum: 200 }
        svids:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: integer }
              name: { type: string }
              unit: { type: string }
    CollectorState:
      type: object
      description: 采集器状态与数据（v6）
      properties:
        configured: { type: boolean }
        running: { type: boolean }
        mode: { type: string, enum: [local, remote] }
        startCeid: { type: integer }
        stopCeid: { type: integer }
        intervalMs: { type: integer }
        samples: { type: integer }
        decodeErrors: { type: integer }
        lastRttMs: { type: integer }
        svids:
          type: array
          description: 已配置的采集 SVID(id 与名称)
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        staleSvids:
          type: array
          items: { type: integer }
        series:
          type: array
          items:
            type: object
            properties:
              svid: { type: integer }
              name: { type: string }
              unit: { type: string }
              t:
                type: array
                items: { type: integer, format: int64 }
              v:
                type: array
                items: { type: number }
    MessagePage:
      type: object
      required: [messages, total, limit, truncated]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string }
              direction: { type: string, enum: [in, out] }
              stream: { type: integer }
              function: { type: integer }
              wbit: { type: boolean }
              body: { type: string }
              at: { type: integer, format: int64 }
        total: { type: integer }
        limit: { type: integer }
        truncated: { type: boolean }
    SentMessageResult:
      type: object
      required: [ok, stream, function, wbit, sentSml, timedOut, elapsedMs]
      properties:
        ok: { type: boolean }
        stream: { type: integer }
        function: { type: integer }
        wbit: { type: boolean }
        sentSml: { type: string }
        timedOut: { type: boolean }
        replyStream: { type: integer }
        replyFunction: { type: integer }
        replyWbit: { type: boolean }
        replySml:
          type: string
          nullable: true
        elapsedMs: { type: integer, format: int64 }
    ConfigEntry:
      type: object
      required: [name, sizeBytes, modifiedMs]
      properties:
        name: { type: string }
        sizeBytes: { type: integer, format: int64 }
        modifiedMs: { type: integer, format: int64 }
    ConfigProblems:
      type: object
      required: [valid, problems]
      properties:
        valid: { type: boolean }
        problems:
          type: array
          items: { type: string }
    ConfigTemplateEntry:
      type: object
      description: 内置设备模板目录里的一项
      required: [id, label, description]
      properties:
        id: { type: string, example: etch }
        label: { type: string, example: 刻蚀腔 }
        description: { type: string, example: 温场/射频/腔压曲线 + 过热与腔压异常事件 }
    AuditEntry:
      type: object
      required: [at, actor, role, action, target, detail]
      properties:
        at: { type: integer, format: int64 }
        actor: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        action: { type: string }
        target: { type: string }
        detail: { type: string }

    SessionCreateRequest:
      type: object
      required: [config]
      properties:
        config:
          type: string
          description: "`demo` 或 --work-dir 下的配置文件名（不接受路径）"
        sessionId:
          type: string
          description: 部署期覆盖：会话 id；不填用配置里的
        bindHost:
          type: string
          description: 部署期覆盖：绑定地址
        port:
          type: integer
          description: 部署期覆盖：HSMS 端口（1-65535）
        deviceId:
          type: integer
          description: 部署期覆盖：device-id
    SessionBulkRequest:
      type: object
      required: [config, count]
      properties:
        config:
          type: string
        count:
          type: integer
          minimum: 1
          maximum: 100
        sessionIdPrefix:
          type: string
          default: dev-
        portBase:
          type: integer
          description: 0 表示都用配置里的端口
        deviceIdBase:
          type: integer
        bindHost:
          type: string
    SessionBulkResult:
      type: object
      properties:
        created:
          type: array
          items:
            type: string
        failed:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              error:
                type: string
