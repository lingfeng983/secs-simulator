[package]
name = "secs-sim-gui"
version = "2.0.0"
edition = "2021"
rust-version = "1.77"
description = "SECS Simulator desktop shell"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
