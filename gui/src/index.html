<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SECS Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <img class="logo" src="icon.png" alt="" />
      <div>
        <h1>SECS Simulator</h1>
        <p class="tagline">SECS/GEM 多单元设备模拟器</p>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="local" role="tab">本机运行</button>
      <button class="tab" data-tab="remote" role="tab">连接服务器</button>
    </nav>

    <main>
      <section id="panel-local" class="panel active">
        <p class="hint">
          在本机启动一个一体化模拟器（只绑定 127.0.0.1），自动打开界面。
          适合单机演示与调试。
        </p>
        <label class="check">
          <input id="demo" type="checkbox" checked />
          <span>启动两腔体演示会话（HSMS 5000，可应答 S1F3）</span>
        </label>
        <div class="actions">
          <button id="start-local" class="primary">启动本机模拟器</button>
          <button id="stop-local" class="ghost">停止</button>
        </div>
      </section>

      <section id="panel-remote" class="panel">
        <p class="hint">
          连接远程 Linux 服务端。地址、端口与 token 由服务端启动参数决定；
          若服务端使用 keystore，请勾选 HTTPS。
        </p>
        <div class="grid">
          <label>
            <span>服务器地址</span>
            <input id="host" type="text" placeholder="192.168.1.20" autocomplete="off" />
          </label>
          <label>
            <span>端口</span>
            <input id="port" type="number" min="1" max="65535" value="8080" />
          </label>
        </div>
        <label>
          <span>访问 token</span>
          <input id="token" type="password" placeholder="服务端 --token 的值" autocomplete="off" />
        </label>
        <label class="check">
          <input id="tls" type="checkbox" />
          <span>HTTPS（服务端提供 --tls-keystore）</span>
        </label>
        <div class="actions">
          <button id="connect" class="primary">连接服务器</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>

    <footer>
      <span>v2.0.0</span>
      <span>关闭窗口后仍在托盘运行</span>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
