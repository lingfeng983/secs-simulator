<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0e1621" />
    <title>SECS Simulator</title>
    <!-- 独立文件而不是内联脚本：CSP script-src 'self' 下内联会被拦，首帧主题失效 -->
    <script src="/theme-init.js"></script>
    <style>
      /* 首屏占位:脚本下载、后端地址解析期间的空白不该是一块刺眼的白 */
      html, body { margin: 0; height: 100%; }
      html[data-theme='light'] body { background: #f1f4f8; }
      html[data-theme='dark'] body { background: #070b10; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 14px;
        font: 500 12px/1.6 "Inter", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      html[data-theme='light'] #boot { color: #5f6f85; }
      html[data-theme='dark'] #boot { color: #8a9aad; }
      #boot .boot-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(150deg, #5eead4, #14b8a6 62%, #0d9488);
        box-shadow: 0 6px 18px rgba(20, 184, 166, 0.28);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot .boot-inner { display: grid; justify-items: center; gap: 12px; }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.62; transform: scale(0.94); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-mark { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-mark" aria-hidden="true"></div>
        <div>SECS Simulator</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
