<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SECS Simulator</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>SECS Simulator</h1>
    <dl id="health">
      <dt>形态</dt><dd id="mode">-</dd>
      <dt>版本</dt><dd id="version">-</dd>
      <dt>会话</dt><dd id="session-count">-</dd>
      <dt>事件流</dt><dd id="stream">未连接</dd>
    </dl>
  </header>

  <section id="token-panel" hidden>
    <p>需要访问令牌（启动时打印在 <code>READY</code> 行里，或由桌面壳注入）。</p>
    <input id="token-input" type="password" placeholder="token" autocomplete="off">
    <button id="token-save">保存</button>
  </section>

  <main>
    <section>
      <h2>会话</h2>
      <table id="sessions">
        <thead>
          <tr>
            <th>id</th><th>状态</th><th>设备</th><th>单元</th>
            <th>已上报</th><th>限流丢弃</th><th>禁用跳过</th><th>S6F1</th><th>操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="hint">手动触发：先填 CEID，再点对应会话的「上报」。</p>
      <label>CEID <input id="ceid" type="number" value="2001" min="1"></label>
    </section>

    <section>
      <h2>事件流</h2>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
