# 主 CI：后端（Linux + Windows）+ 前端 + 契约检查。
#
# 本地门禁是两个模块各自的 check.ps1（secs-simulator-service/scripts/check.ps1 与
# secs-simulator-ui/scripts/check.ps1），仍是提交前的完整闸门（含原生链路的手动步骤）；
# 这里把同一组检查搬到每次 push/PR，避免"只在本机能跑"的回归。两个后端平台
# 都跑：SO_REUSEADDR 语义、端口探测、原生二进制路径在 Windows 与 Linux 上
# 并不相同，只在一个平台上绿过不算数。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: secs-simulator-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn -B test
        run: mvn -B -ntp test

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secs-simulator-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: secs-simulator-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # 界面文案门禁：与本地 check.ps1 第 3 步同源（该脚本失败时自己 exit 1）
      - name: check-ui-words.ps1（界面文案）
        shell: pwsh
        run: ./scripts/check-ui-words.ps1
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  gui:
    name: 桌面壳（Rust）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: secs-simulator-gui/src-tauri
    steps:
      - uses: actions/checkout@v5
      # tauri 的 generate_context! 在编译期内嵌 frontendDist（../../secs-simulator-ui/dist），
      # cargo check 也需要该目录存在。这里不构建真前端（那是 frontend job 的事），
      # 只放一个占位 index.html 满足编译期资产收集；不跑 tauri build（太重）。
      - name: 占位前端 dist（仅供 cargo check）
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'secs-simulator-ui/dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Set-Content -Path (Join-Path $dist 'index.html') -Value '<!doctype html><title>placeholder</title>' -Encoding utf8
      # tauri.conf.json 的 bundle.resources 指向 src-tauri/resources，该目录被 .gitignore
      # 排除、只在 package.ps1 打包时填充；cargo check 仍要求路径存在，否则 build.rs 直接报错。
      - name: 占位后端 resources（仅供 cargo check）
        shell: pwsh
        run: |
          $res = Join-Path $env:GITHUB_WORKSPACE 'secs-simulator-gui/src-tauri/resources'
          New-Item -ItemType Directory -Force -Path $res | Out-Null
          Set-Content -Path (Join-Path $res '.placeholder') -Value 'placeholder for cargo check' -Encoding utf8
      # windows runner 自带 Rust 工具链（Cargo.toml 要求 rust-version 1.90，runner 版本更新）
      - name: cargo check
        run: cargo check --locked

  contract:
    name: 契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: openapi 契约（重复键/$ref/快照/前缀覆盖）
        run: python secs-simulator-service/scripts/check-openapi.py
      # 含非 ASCII 字符的 .ps1 必须带 UTF-8 BOM（PowerShell 5.1 会把无 BOM 的
      # UTF-8 按 ANSI 读，中文乱码）。原 scripts/check-bom.ps1 已并入这里。
      - name: .ps1 UTF-8 BOM
        shell: pwsh
        run: |
          $bad = @(); $n = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|target|package|dist)[\\/]' } |
            ForEach-Object {
              $n++
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = ($bytes.Length -ge 3) -and ($bytes[0] -eq 0xEF) -and ($bytes[1] -eq 0xBB) -and ($bytes[2] -eq 0xBF)
              $body = if ($hasBom -and $bytes.Length -gt 3) { $bytes[3..($bytes.Length - 1)] } else { $bytes }
              if (($body.Where({ $_ -gt 127 }).Count -gt 0) -and -not $hasBom) { $script:bad += $_.FullName }
            }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "缺 UTF-8 BOM: $_" }; exit 1 }
          Write-Host "BOM 检查通过 ($n 个 .ps1)"
