# 主 CI：后端（Linux + Windows）+ 前端 + 契约检查。
#
# 本地门禁是两个模块各自的 check.ps1（secs-simulator-service/scripts/check.ps1 与
# secs-simulator-ui/scripts/check.ps1），仍是提交前的完整闸门（含原生链路的手动步骤）；
# 这里把同一组检查搬到每次 push/PR，避免"只在本机能跑"的回归。两个后端平台
# 都跑：SO_REUSEADDR 语义、端口探测、原生二进制路径在 Windows 与 Linux 上
# 并不相同，只在一个平台上绿过不算数。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: secs-simulator-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn -B test
        run: mvn -B -ntp test

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secs-simulator-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: secs-simulator-ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  contract:
    name: 契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: openapi 重复键
        run: python secs-simulator-service/scripts/check-openapi.py
      # 含非 ASCII 字符的 .ps1 必须带 UTF-8 BOM（PowerShell 5.1 会把无 BOM 的
      # UTF-8 按 ANSI 读，中文乱码）。原 scripts/check-bom.ps1 已并入这里。
      - name: .ps1 UTF-8 BOM
        shell: pwsh
        run: |
          $bad = @(); $n = 0
          Get-ChildItem -Path . -Recurse -Filter *.ps1 -File |
            Where-Object { $_.FullName -notmatch '\\(node_modules|target|package|dist)\\' } |
            ForEach-Object {
              $n++
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $hasBom = ($bytes.Length -ge 3) -and ($bytes[0] -eq 0xEF) -and ($bytes[1] -eq 0xBB) -and ($bytes[2] -eq 0xBF)
              $body = if ($hasBom -and $bytes.Length -gt 3) { $bytes[3..($bytes.Length - 1)] } else { $bytes }
              if (($body.Where({ $_ -gt 127 }).Count -gt 0) -and -not $hasBom) { $script:bad += $_.FullName }
            }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host "缺 UTF-8 BOM: $_" }; exit 1 }
          Write-Host "BOM 检查通过 ($n 个 .ps1)"
