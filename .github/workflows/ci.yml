# 主 CI：后端（Linux + Windows）+ 前端 + 契约检查。
#
# 本地门禁 scripts/check-all.ps1 仍是提交前的完整闸门（含原生链路的手动步骤）；
# 这里把同一组检查搬到每次 push/PR，避免"只在本机能跑"的回归。两个后端平台
# 都跑：SO_REUSEADDR 语义、端口探测、原生二进制路径在 Windows 与 Linux 上
# 并不相同，只在一个平台上绿过不算数。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: mvn -B test
        run: mvn -B -ntp test

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  contract:
    name: 契约检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: openapi 重复键
        run: python scripts/check-openapi.py
      - name: .ps1 UTF-8 BOM
        shell: pwsh
        run: ./scripts/check-bom.ps1
