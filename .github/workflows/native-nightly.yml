# 原生镜像夜间构建：`-Pnative verify` 构建成功后用 failsafe 跑 NativeRuntimeIT
# （DBSPIKE / API、SSE 票据、HSMS S1F1/S1F3、优雅停机）。
#
# 为什么单独一条：镜像构建本身要十分钟上下，且 Windows 上的 native-image 依赖
# runner 自带的 MSVC 工具链。放在每次 push 的路径上只会拖慢反馈。
# 3.0 M0 起（设计 §2.3.1）：sqlite-jdbc(JNI) 是硬门禁，任务改为
# 双平台矩阵、失败即红（去掉 continue-on-error）——夜间不红就等于没有覆盖。
# 前端产物必须先构建：NativeRuntimeIT 的静态托管用例要求 secs-simulator-ui/dist。
name: Native nightly

on:
  schedule:
    - cron: '0 18 * * *'   # 02:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: 原生镜像 + NativeRuntimeIT（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: secs-sim.exe
            artifact: secs-sim-windows
          - os: ubuntu-latest
            exe: secs-sim
            artifact: secs-sim-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: secs-simulator-ui/package-lock.json
      - name: 构建前端产物
        working-directory: secs-simulator-ui
        run: |
          npm ci
          npm run build
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - name: mvn -Pnative verify
        working-directory: secs-simulator-service
        run: mvn -B -ntp -Pnative verify -pl secs-cli -am
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: secs-simulator-service/secs-cli/target/${{ matrix.exe }}
          if-no-files-found: error
